services:
  redis-test:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "codespaces-test-only"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a codespaces-test-only ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse-test:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      CLICKHOUSE_DB: aitos
      CLICKHOUSE_USER: aitos_test
      CLICKHOUSE_PASSWORD: aitos_test_password
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  neo4j-test:
    image: neo4j:5.19-community
    environment:
      NEO4J_AUTH: neo4j/codespaces-test-password
    ports: ["127.0.0.1:7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
