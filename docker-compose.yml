services:
  redis:
    image: redis:7.2-alpine
    container_name: aitos-redis
    ports: ["127.0.0.1:6379:6379"]
    volumes: [aitos_redis_data:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    cpus: "0.25"
    mem_limit: 512m
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: aitos-clickhouse
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    environment:
      CLICKHOUSE_DB: aitos
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [aitos_clickhouse_data:/var/lib/clickhouse]
    cpus: "1.0"
    mem_limit: 5g
    healthcheck: {test: ["CMD", "clickhouse-client", "--query", "SELECT 1"], interval: 10s, timeout: 5s, retries: 5, start_period: 60s}
    restart: unless-stopped

  neo4j:
    image: neo4j:5.19-community
    container_name: aitos-neo4j
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}"
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes: [aitos_neo4j_data:/data, aitos_neo4j_logs:/logs]
    cpus: "0.5"
    mem_limit: 2.5g
    healthcheck: {test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped

  aitos-paper:
    build: .
    container_name: aitos-paper
    command: ["python3", "run_paper_trading.py"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, CLICKHOUSE_HOST: clickhouse, NEO4J_URI: bolt://neo4j:7687}
    volumes: [aitos_model_data:/models]
    ports: ["127.0.0.1:8090:8090"]
    cpus: "0.5"
    mem_limit: 1.5g
    depends_on: {redis: {condition: service_healthy}, clickhouse: {condition: service_healthy}, neo4j: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"], interval: 30s, timeout: 10s, retries: 5, start_period: 30s}
    restart: unless-stopped

  aitos-learning:
    build: .
    container_name: aitos-learning
    command: ["python3", "run_continual_learning.py"]
    env_file: [.env]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: aitos
      LEARNING_MODEL_PATH: /models/online_rl/deep_value.pkl
      LEARNING_STATE_PATH: /models/online_rl/worker_state.json
      LEARNING_POLL_SECONDS: "60"
      LEARNING_LOOKBACK_HOURS: "168"
    volumes: [aitos_model_data:/models]
    depends_on: {clickhouse: {condition: service_healthy}}
    cpus: "0.25"
    mem_limit: 512m
    restart: unless-stopped

  aitos-backtest:
    build: .
    command: ["python3", "-m", "aitos.backtest.cli"]
    volumes: ["${BACKTEST_DATA_DIR:-./data}:/data:ro", "aitos_model_data:/models:ro"]
    environment: {PYTHONUNBUFFERED: "1", CLICKHOUSE_HOST: clickhouse, CLICKHOUSE_PORT: "8123", CLICKHOUSE_DB: aitos, CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}", CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"}
    depends_on: {clickhouse: {condition: service_healthy}}
    cpus: "1.5"
    mem_limit: 3g
    restart: "no"
    profiles: [backtest]

  aitos-storage-maintenance:
    build: .
    container_name: aitos-storage-maintenance
    command: ["python3", "-m", "aitos.storage.maintenance"]
    env_file: [.env]
    environment: {CLICKHOUSE_HOST: clickhouse, CLICKHOUSE_PORT: "8123", CLICKHOUSE_DB: aitos, CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}", CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}", CLICKHOUSE_STORAGE_BUDGET_GB: "100", CLICKHOUSE_STORAGE_TARGET_GB: "90", BACKTEST_CACHE_MAX_GB: "20", BACKTEST_DATA_DIR: /data, STORAGE_MAINTENANCE_INTERVAL_SECONDS: "86400", STORAGE_MAINTENANCE_DRY_RUN: "false"}
    volumes: ["${BACKTEST_DATA_DIR:-./data}:/data"]
    depends_on: {clickhouse: {condition: service_healthy}}
    cpus: "0.25"
    mem_limit: 256m
    restart: unless-stopped

  aitos-live:
    build: .
    container_name: aitos-live
    command: ["python3", "run_live_trading.py"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, CLICKHOUSE_HOST: clickhouse, NEO4J_URI: bolt://neo4j:7687}
    volumes: [aitos_model_data:/models]
    ports: ["127.0.0.1:8091:8091"]
    stdin_open: true
    tty: true
    depends_on: {redis: {condition: service_healthy}, clickhouse: {condition: service_healthy}, neo4j: {condition: service_healthy}}
    cpus: "0.5"
    mem_limit: 1.5g
    restart: "no"
    profiles: [live]

volumes:
  aitos_redis_data:
  aitos_clickhouse_data:
  aitos_neo4j_data:
  aitos_neo4j_logs:
  aitos_model_data:
