services:
  redis:
    image: redis:7.2-alpine
    container_name: aitos-redis
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["${REDIS_DATA_DIR:-./.storage/data/redis}:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    cpus: "0.25"
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: aitos-clickhouse
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    environment:
      CLICKHOUSE_DB: aitos
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - "${CLICKHOUSE_DATA_DIR:-./.storage/data/clickhouse}:/var/lib/clickhouse"
      - ./docker/clickhouse/config.d/aitos.xml:/etc/clickhouse-server/config.d/aitos.xml:ro
      - ./docker/clickhouse/users.d/aitos.xml:/etc/clickhouse-server/users.d/aitos.xml:ro
    cpus: "1.0"
    mem_limit: 5g
    logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --timeout=5 http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    command: ["sh", "-ec", "clickhouse-client --host clickhouse --user \"$${CLICKHOUSE_USER:-default}\" --password \"$${CLICKHOUSE_PASSWORD:-}\" --query 'CREATE DATABASE IF NOT EXISTS aitos'"]
    depends_on:
      clickhouse: {condition: service_healthy}
    restart: "no"

  neo4j:
    image: neo4j:5.19-community
    container_name: aitos-neo4j
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}"
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - "${NEO4J_DATA_DIR:-./.storage/data/neo4j}:/data"
      - "${NEO4J_LOG_DIR:-./.storage/others/neo4j-logs}:/logs"
    cpus: "0.5"
    mem_limit: 2.5g
    healthcheck: {test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped

  aitos-paper:
    image: "${AITOS_IMAGE:-ghcr.io/fahadhossain0909/aitos}:${AITOS_IMAGE_TAG:-latest}"
    container_name: aitos-paper
    command: ["python3", "run_paper_trading.py"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, CLICKHOUSE_HOST: clickhouse, NEO4J_URI: bolt://neo4j:7687}
    volumes: [aitos_model_data:/models]
    ports: ["127.0.0.1:8090:8090"]
    cpus: "0.5"
    mem_limit: 1.5g
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    depends_on:
      redis: {condition: service_healthy}
      clickhouse-init: {condition: service_completed_successfully}
      neo4j: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"], interval: 30s, timeout: 10s, retries: 5, start_period: 30s}
    restart: unless-stopped

  aitos-learning:
    image: "${AITOS_IMAGE:-ghcr.io/fahadhossain0909/aitos}:${AITOS_IMAGE_TAG:-latest}"
    container_name: aitos-learning
    command: ["python3", "run_continual_learning.py"]
    env_file: [.env]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: aitos
      LEARNING_MODEL_PATH: /models/online_rl/deep_value.pkl
      LEARNING_STATE_PATH: /models/online_rl/worker_state.json
      LEARNING_POLL_SECONDS: "60"
      LEARNING_LOOKBACK_HOURS: "168"
    volumes: [aitos_model_data:/models]
    depends_on:
      clickhouse-init: {condition: service_completed_successfully}
    cpus: "0.25"
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    restart: unless-stopped

  aitos-backtest:
    image: "${AITOS_IMAGE:-ghcr.io/fahadhossain0909/aitos}:${AITOS_IMAGE_TAG:-latest}"
    command: ["python3", "-m", "aitos.backtest.cli"]
    volumes:
      - "${BACKTEST_DATA_DIR:-./.storage/others/backtest}:/data:rw"
      - aitos_model_data:/models:ro
    environment: {PYTHONUNBUFFERED: "1", CLICKHOUSE_HOST: clickhouse, CLICKHOUSE_PORT: "8123", CLICKHOUSE_DB: aitos, CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}", CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"}
    depends_on: {clickhouse-init: {condition: service_completed_successfully}}
    cpus: "1.5"
    mem_limit: 3g
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    restart: "no"
    profiles: [backtest]

  aitos-storage-maintenance:
    image: "${AITOS_IMAGE:-ghcr.io/fahadhossain0909/aitos}:${AITOS_IMAGE_TAG:-latest}"
    container_name: aitos-storage-maintenance
    command: ["python3", "-m", "aitos.storage.maintenance"]
    env_file: [.env]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: aitos
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_STORAGE_BUDGET_GB: "130"
      CLICKHOUSE_STORAGE_TARGET_GB: "120"
      OTHERS_DATA_DIR: /others
      OTHERS_MAX_GB: "22.5"
      BOOT_FREE_BUFFER_GB: "10"
      STORAGE_AUTO_DELETE_PERCENT: "2.5"
      STORAGE_MAINTENANCE_INTERVAL_SECONDS: "300"
      STORAGE_MAINTENANCE_DRY_RUN: "false"
    volumes:
      - "${OTHERS_DATA_DIR:-./.storage/others}:/others"
    depends_on: {clickhouse-init: {condition: service_completed_successfully}}
    cpus: "0.25"
    mem_limit: 256m
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    restart: unless-stopped

  aitos-live:
    image: "${AITOS_IMAGE:-ghcr.io/fahadhossain0909/aitos}:${AITOS_IMAGE_TAG:-latest}"
    container_name: aitos-live
    command: ["python3", "run_live_trading.py"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, CLICKHOUSE_HOST: clickhouse, NEO4J_URI: bolt://neo4j:7687}
    volumes: [aitos_model_data:/models]
    ports: ["127.0.0.1:8091:8091"]
    stdin_open: true
    tty: true
    depends_on:
      redis: {condition: service_healthy}
      clickhouse-init: {condition: service_completed_successfully}
      neo4j: {condition: service_healthy}
    cpus: "0.5"
    mem_limit: 1.5g
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    restart: "no"
    profiles: [live]

volumes:
  aitos_model_data:
