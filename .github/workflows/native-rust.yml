name: Native Rust Core

on:
  pull_request:
    branches: [main, master, develop]
    paths: ["native/rust/**", "aitos/native_core.py", "native/python_tests/test_native_core.py", "native/python_tests/test_native_orderbook_parity.py", "benchmarks/native_core_benchmark.py", "benchmarks/native_core_burst_benchmark.py", ".github/workflows/native-rust.yml"]
  push:
    branches: [main]
    paths: ["native/rust/**", "aitos/native_core.py", "native/python_tests/test_native_core.py", "native/python_tests/test_native_orderbook_parity.py", "benchmarks/native_core_benchmark.py", "benchmarks/native_core_burst_benchmark.py", ".github/workflows/native-rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path native/rust/Cargo.toml -- --check
      - run: cargo test --manifest-path native/rust/Cargo.toml
      - run: cargo clippy --manifest-path native/rust/Cargo.toml --all-targets -- -D warnings

  python-fallback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest black==25.12.0 structlog aiohttp 'websockets>=13,<14'
      - run: black --check aitos/native_core.py native/python_tests/test_native_core.py native/python_tests/test_native_orderbook_parity.py benchmarks/native_core_benchmark.py
      - run: PYTHONPATH=. pytest -q native/python_tests/test_native_core.py native/python_tests/test_native_orderbook_parity.py

  python-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Build extension in isolated virtualenv
        run: |
          python -m venv .venv-native
          . .venv-native/bin/activate
          python -m pip install --upgrade pip maturin pytest structlog aiohttp 'websockets>=13,<14'
          maturin develop --manifest-path native/rust/Cargo.toml
          PYTHONPATH=. python -c "from aitos.native_core import native_available; assert native_available()"
          PYTHONPATH=. pytest -q native/python_tests/test_native_core.py native/python_tests/test_native_orderbook_parity.py
          PYTHONPATH=. python benchmarks/native_core_benchmark.py --events 50000 --repeats 3 --warmup 2000 --batch-size 64
