name: Native Rust Core

on:
  pull_request:
    branches: [main, master, develop]
    paths: ["native/rust/**", "aitos/native_core.py", "tests/test_native_core.py", ".github/workflows/native-rust.yml"]
  push:
    branches: [main]
    paths: ["native/rust/**", "aitos/native_core.py", "tests/test_native_core.py", ".github/workflows/native-rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path native/rust/Cargo.toml

  python-fallback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest black==25.12.0
      - run: black --check aitos/native_core.py tests/test_native_core.py benchmarks/native_core_benchmark.py
      - run: PYTHONPATH=. pytest -q tests/test_native_core.py

  python-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Build extension in isolated virtualenv
        run: |
          python -m venv .venv-native
          . .venv-native/bin/activate
          python -m pip install --upgrade pip maturin pytest
          maturin develop --manifest-path native/rust/Cargo.toml
          PYTHONPATH=. python -c "from aitos.native_core import native_available; assert native_available()"
          PYTHONPATH=. pytest -q tests/test_native_core.py
