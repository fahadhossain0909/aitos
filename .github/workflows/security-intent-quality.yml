name: Secure signing intent quality (paper-only)
on:
  push:
    branches: [arena/ed127d35-aitos]
  pull_request:
    paths:
      - 'aitos/security/**'
      - 'tests/security/**'
      - '.github/workflows/security-intent-quality.yml'
permissions:
  contents: read
concurrency:
  group: security-intent-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paper-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: python -m pip install pytest black==25.12.0
      - name: Verify formatting
        run: black --check --diff aitos/security/signing_policy.py aitos/security/replay_store.py aitos/security/paper_processor.py aitos/security/risk_limits.py aitos/security/mtls.py aitos/security/signer_credentials.py aitos/security/signer_rpc_protocol.py aitos/security/signer_service.py aitos/security/risk_state.py aitos/security/signer_cli.py aitos/security/signer_rpc_client.py aitos/exchange/binance_usdm_paper_signer.py tests/security
      - name: Validate trusted-host installer and PKI bootstrap
        run: |
          bash -n scripts/install_user_controlled_signer_linux.sh
          bash -n scripts/bootstrap_signer_pki.sh
          cert_dir="$(mktemp -d)"
          trap 'rm -rf "$cert_dir"' EXIT
          AITOS_SIGNER_CERT_DIR="$cert_dir" bash scripts/bootstrap_signer_pki.sh DNS:localhost spiffe://aitos/runtime/paper
          AITOS_SIGNER_CERT_DIR="$cert_dir" bash scripts/bootstrap_signer_pki.sh DNS:localhost spiffe://aitos/runtime/paper
          test "$(find "$cert_dir" -maxdepth 1 -name 'client-*.crt' | wc -l)" -eq 2
      - name: Run security intent tests
        env:
          PYTHONPATH: .
        run: python -m pytest --confcutdir=tests/security tests/security -q
