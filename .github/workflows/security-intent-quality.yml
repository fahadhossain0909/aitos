name: Secure signing intent quality (paper-only)
on:
  push:
    branches: [arena/ed127d35-aitos]
  pull_request:
    paths:
      - 'aitos/security/**'
      - 'tests/security/**'
      - '.github/workflows/security-intent-quality.yml'
permissions:
  contents: read
concurrency:
  group: security-intent-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paper-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test tools
        run: python -m pip install pytest black==25.12.0
      - name: Verify formatting
        run: black --check --diff aitos/security/signing_policy.py aitos/security/replay_store.py aitos/security/paper_processor.py tests/security
      - name: Run security intent tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/security -q
