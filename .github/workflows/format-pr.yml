name: One-time PR formatter

on:
  push:
    branches: [ci/production-quality-gates]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install formatters
        run: python -m pip install --upgrade pip black isort
      - name: Apply Black and isort
        run: |
          black .
          isort .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Black and isort'
          git push origin HEAD:${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
