name: Isolated ledger SQL quality (no deployment)
on:
  push:
    branches: [arena/ed127d35-aitos]
  pull_request:
    paths:
      - 'aitos/trading/persistent_state.py'
      - 'aitos/trading/performance.py'
      - 'tests/test_clickhouse_embedded_ledger.py'
      - 'tests/test_closed_performance.py'
      - 'tests/requirements-clickhouse-embedded.txt'
      - '.github/workflows/ledger-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ledger-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  embedded-clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements-clickhouse-embedded.txt
      - run: python -m pip install -r requirements.txt -r tests/requirements-clickhouse-embedded.txt
      - name: Run read-only analytics contracts and real embedded SQL checks
        run: python -m pytest tests/test_closed_performance.py tests/test_clickhouse_embedded_ledger.py --timeout=60 -q
