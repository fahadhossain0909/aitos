name: Format watchdog fix

on:
  push:
    branches: ["fix/trade-watchdog-code"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" == "style: format watchdog fix" ]]; then
            echo "Formatter commit already applied; nothing to do."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install black==25.12.0
          black .
          git diff --check

          if git diff --quiet; then
            echo "Repository is already Black-formatted."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.py'
          git commit -m 'style: format watchdog fix'
          git push origin HEAD:fix/trade-watchdog-code
        env:
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
