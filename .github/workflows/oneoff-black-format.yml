name: One-off Black Format

on:
  push:
    branches:
      - fix/trade-stream-combined-connection

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install black
      - name: Format changed files
        run: |
          black aitos/exchange/binance.py
          if ! git diff --quiet -- aitos/exchange/binance.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aitos/exchange/binance.py
            git commit -m "style: apply Black formatting to Binance adapter"
            git push
          fi
