name: PR #38 formatting

on:
  push:
    branches:
      - feat/production-risk-reliability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-risk-reliability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format with CI Black version
        run: |
          python -m pip install --disable-pip-version-check black==26.5.1
          black aitos/exchange/symbol_filter_refresher.py aitos/trading/persistent_state.py run_live_trading.py tests/test_production_reliability.py
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/exchange/symbol_filter_refresher.py aitos/trading/persistent_state.py run_live_trading.py tests/test_production_reliability.py
          git commit -m "chore: apply Black formatting"
          git push origin HEAD:feat/production-risk-reliability
