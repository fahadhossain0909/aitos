name: Debug Black Formatting

on:
  push:
    branches:
      - fix/trade-stream-combined-connection

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install black
      - name: Show Black rewrite
        run: |
          black aitos/exchange/binance.py
          git diff -- aitos/exchange/binance.py
