name: Linux console build and package validation
on:
  push:
    branches: [arena/ed127d35-aitos]
  pull_request:
    paths:
      - 'native/linux/**'
      - 'aitos/native/**'
      - 'aitos/config/paths.py'
      - 'tests/test_credential_vault.py'
      - 'tests/test_portable_paths.py'
      - 'desktop/**'
      - '.github/workflows/linux-console.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsecret-1-0 libglib2.0-0 libdbus-1-3 libnss3 libx11-6 libxext6 libxrender1 libxss1 libxtst6 dpkg-dev
      - name: Portable path and vault contracts
        run: |
          python -m pip install python-dotenv pytest
          python -m pytest tests/test_portable_paths.py tests/test_credential_vault.py -q
      - name: Build Debian package
        run: PYTHON_BIN=/usr/bin/python3 bash native/linux/build.sh
      - name: Validate package metadata and payload
        run: |
          package="$(find artifacts/linux -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -q '/opt/aitos/AITOS-Console'
          dpkg-deb --contents "$package" | grep -q '/usr/share/applications/aitos-console.desktop'
          sha256sum --check artifacts/linux/SHA256SUMS
      - name: Extract and execute frozen bundle smoke
        run: |
          package="$(find artifacts/linux -name '*.deb' -print -quit)"
          target="$RUNNER_TEMP/aitos-linux-package"
          mkdir -p "$target"
          dpkg-deb --extract "$package" "$target"
          "$target/opt/aitos/AITOS-Console" --bundle-self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-linux-console-deb
          path: artifacts/linux/*
