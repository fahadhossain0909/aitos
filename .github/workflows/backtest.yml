name: Backtest Tests

on:
  # Feature branches are tested by pull_request, not by duplicate push events.
  push:
    branches: [main]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: backtest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install backtest dependencies
        run: python -m pip install -r requirements-backtest.txt
      - name: Run backtest tests
        run: python -m pytest -q tests/backtest
