name: Render-equivalent Binance Paper Canary

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/paper-canary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aitos-paper-canary
  cancel-in-progress: true

jobs:
  paper-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_DB: aitos
          CLICKHOUSE_USER: aitos_test
          CLICKHOUSE_PASSWORD: aitos_test_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AITOS_MODE: paper
      BINANCE_TESTNET: "true"
      AITOS_BINANCE_FUTURES_REST_BASE_URL: https://testnet.binancefuture.com
      AITOS_BINANCE_FUTURES_WS_BASE_URL: wss://stream.binancefuture.com
      AITOS_BINANCE_FUTURES_WS_COMBINED_URL: wss://stream.binancefuture.com/stream
      AITOS_BINANCE_FUTURES_WS_RAW_URL: wss://stream.binancefuture.com/ws
      TESTING: "false"
      MODEL_DATA_DIR: ${{ github.workspace }}/.paper-canary-models
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: aitos_test
      CLICKHOUSE_PASSWORD: aitos_test_password
      CLICKHOUSE_DATABASE: aitos
      AITOS_EVENTBUS_BACKEND: redis
      AITOS_TUNING_PROFILE: low_resource
      AITOS_TUNING_SCANNER_UNIVERSE_MODE: allowlist
      AITOS_TUNING_SCANNER_SYMBOL_ALLOWLIST: BTCUSDT,ETHUSDT,SOLUSDT
      AITOS_TUNING_SCANNER_CORE_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
      AITOS_TUNING_SCANNER_UNIVERSE_LIMIT: "3"
      AITOS_TUNING_SCANNER_DYNAMIC_UNIVERSE_LIMIT: "0"
      AITOS_TUNING_SCANNER_REFRESH_INTERVAL_SECONDS: "30"
      AITOS_TUNING_SCANNER_MIN_QUOTE_VOLUME_USD: "0"
      AITOS_TUNING_SCANNER_MIN_TRADE_COUNT: "0"
      AITOS_TUNING_SCANNER_MIN_CONTRACT_AGE_DAYS: "0"
      AITOS_TUNING_ANALYSIS_EXPENSIVE_ANALYSIS_CONCURRENCY: "1"
      AITOS_TUNING_HARDWARE_CPU_WORKER_BUDGET: "2"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AITOS runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for analytical storage
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8123/ping >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" \
            http://127.0.0.1:8123/ --data-binary "SELECT 1"
      - name: Start Binance public-market-data paper runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DATA_DIR"
          python run_paper_trading.py > paper-canary.log 2>&1 &
          echo $! > paper-canary.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8090/health > paper-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat paper-canary.pid)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat paper-canary.log
            exit 1
          fi
          cat paper-health.json
      - name: Sustain and verify per-symbol live-data paper canary
        run: |
          set -euo pipefail
          sleep 480
          curl -fsS http://127.0.0.1:8090/health > paper-health-final.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("paper-health-final.json").read_text())
          assert health.get("status") == "healthy", health.get("status")
          modules = {item.get("module_id"): item for item in health.get("modules", [])}
          ingestion = modules.get("data-ingestion-service")
          scanner = modules.get("opportunity-scanner")
          assert ingestion is not None, "data-ingestion-service missing from health"
          assert scanner is not None, "opportunity-scanner missing from health"
          assert ingestion.get("status") == "healthy", ingestion
          assert scanner.get("status") == "healthy", scanner

          details = ingestion.get("details", {})
          required = {"BTCUSDT", "ETHUSDT", "SOLUSDT"}
          subscribed = {str(symbol).upper() for symbol in details.get("live_trade_symbols", [])}
          missing = sorted(required - subscribed)
          assert not missing, f"live trade subscription missing symbols: {missing}; got {sorted(subscribed)}"
          live_state_count = int(scanner.get("details", {}).get("live_state_symbols", 0) or 0)
          assert live_state_count >= len(required), (
              f"only {live_state_count}/{len(required)} symbols reached the live scanner cache"
          )

          canonical = details.get("canonical_market_data", {})
          gateway_health = canonical.get("health", {})
          assert gateway_health.get("connected") is True, "canonical market-data gateway disconnected"
          assert int(gateway_health.get("dropped_events", 0) or 0) == 0, gateway_health
          assert int(gateway_health.get("publish_errors", 0) or 0) == 0, gateway_health
          runtime_streams = canonical.get("transport", {}).get("runtime_streams", {})
          trade_stream = runtime_streams.get("trades", {})
          assert int(trade_stream.get("events", 0) or 0) > 0, "no live trade stream events received"
          assert int(trade_stream.get("errors", 0) or 0) == 0, trade_stream
          assert int(trade_stream.get("idle_timeouts", 0) or 0) == 0, trade_stream

          deep_symbols = {str(symbol).upper() for symbol in details.get("live_deep_orderbook_symbols", [])}
          assert "BTCUSDT" in deep_symbols, f"BTC deep-orderbook anchor missing: {sorted(deep_symbols)}"
          print(json.dumps({
              "status": health["status"],
              "live_trade_symbols": sorted(subscribed),
              "live_state_symbols": live_state_count,
              "deep_orderbook_symbols": sorted(deep_symbols),
              "trade_stream_events": trade_stream.get("events"),
              "gateway_dropped_events": gateway_health.get("dropped_events"),
          }, indent=2))
          PY
          test "$(grep -c "scan cycle complete" paper-canary.log)" -ge 2
          grep -E "scan cycle complete|scanner market-data stage reached|live trade subscription reconfigured|staged scan complete" paper-canary.log | tail -n 120 || true
      - name: Stop paper runtime and verify graceful shutdown
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -f paper-canary.pid ]; then
            pid="$(cat paper-canary.pid)"
            runtime_alive() {
              local process_state
              process_state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d ' ')"
              [ -n "$process_state" ] && [[ "$process_state" != Z* ]]
            }
            if runtime_alive; then
              kill -INT "$pid" 2>/dev/null || true
              for attempt in $(seq 1 30); do
                runtime_alive || break
                sleep 2
              done
            fi
            if runtime_alive; then
              echo "SIGINT grace period expired; escalating to SIGTERM"
              kill -TERM "$pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                runtime_alive || break
                sleep 2
              done
            fi
            if runtime_alive; then
              echo "paper runtime did not stop after SIGTERM; sending SIGKILL"
              kill -KILL "$pid" 2>/dev/null || true
            fi
            set +e
            wait "$pid"
            runtime_exit_code=$?
            set -e
            printf '%s\\n' "$runtime_exit_code" > paper-canary.exit-code
            echo "paper runtime exit code: $runtime_exit_code"
            if [ "$runtime_exit_code" -ne 0 ]; then
              echo "paper runtime exited unsuccessfully"
              tail -n 250 paper-canary.log 2>/dev/null || true
              exit 1
            fi
            if ! grep -Fq '"message": "paper runtime shutdown complete"' paper-canary.log; then
              echo "paper runtime shutdown completion marker missing"
              tail -n 250 paper-canary.log 2>/dev/null || true
              exit 1
            fi
            touch paper-canary.shutdown-marker
          fi
          tail -n 250 paper-canary.log 2>/dev/null || true
      - name: Upload paper canary evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-binance-paper-canary
          path: |
            paper-canary.log
            paper-health.json
            paper-health-final.json
          if-no-files-found: warn
          retention-days: 7
