name: One-time Python 3.10 compatibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Binance websocket timeout for Python 3.10
        shell: python
        run: |
          from pathlib import Path
          path = Path('aitos/exchange/binance.py')
          text = path.read_text()
          old = '''                    async with asyncio.timeout(BINANCE_USDM_WS_MAX_LIFETIME_SECONDS):
                        while True:
                            raw_message = await ws.recv()
'''
          new = '''                    loop = asyncio.get_running_loop()
                    deadline = loop.time() + BINANCE_USDM_WS_MAX_LIFETIME_SECONDS
                    while True:
                        remaining = deadline - loop.time()
                        if remaining <= 0:
                            raise TimeoutError
                        raw_message = await asyncio.wait_for(ws.recv(), timeout=remaining)
'''
          if old not in text:
              raise SystemExit('expected asyncio.timeout block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/py310-compat-fix.yml
          git add aitos/exchange/binance.py
          git commit -m 'fix(binance): support websocket lifetime timeout on Python 3.10'
          git push origin HEAD:main
