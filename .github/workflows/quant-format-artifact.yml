name: Quantitative Format Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/quant-format-artifact.yml"
      - "aitos/statistics/depth_replay.py"
      - "aitos/statistics/duration.py"
      - "aitos/statistics/advanced_models.py"
      - "aitos/statistics/governance_runtime.py"
      - "aitos/statistics/hawkes.py"
      - "aitos/statistics/selection.py"
      - "tests/intelligence/test_candidate_outcome_attribution.py"
      - "tests/statistics/test_advanced_volatility_estimators.py"
      - "tests/statistics/test_governance_runtime.py"
      - "tests/statistics/test_hsmm_hawkes_dependence_replay.py"
      - "tests/statistics/test_synthetic_market_validation.py"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Format quantitative implementation and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==25.12.0
          black aitos/statistics/depth_replay.py aitos/statistics/duration.py aitos/statistics/advanced_models.py aitos/statistics/governance_runtime.py aitos/statistics/hawkes.py aitos/statistics/selection.py tests/intelligence/test_candidate_outcome_attribution.py tests/statistics/test_advanced_volatility_estimators.py tests/statistics/test_governance_runtime.py tests/statistics/test_hsmm_hawkes_dependence_replay.py tests/statistics/test_synthetic_market_validation.py
      - name: Commit formatting corrections to the same PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "All target files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/statistics/depth_replay.py aitos/statistics/duration.py aitos/statistics/advanced_models.py aitos/statistics/governance_runtime.py aitos/statistics/hawkes.py aitos/statistics/selection.py tests/intelligence/test_candidate_outcome_attribution.py tests/statistics/test_advanced_volatility_estimators.py tests/statistics/test_governance_runtime.py tests/statistics/test_hsmm_hawkes_dependence_replay.py tests/statistics/test_synthetic_market_validation.py
          git commit -m "style(quant): apply Black formatting to statistical engine"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
