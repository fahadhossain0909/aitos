name: Quantitative Format Artifact

on:
  pull_request:
    paths:
      - "aitos/statistics/depth_replay.py"
      - "aitos/statistics/duration.py"
      - "aitos/statistics/advanced_models.py"
      - "aitos/statistics/governance_runtime.py"
      - "aitos/statistics/hawkes.py"
      - "aitos/statistics/selection.py"
      - "tests/intelligence/test_candidate_outcome_attribution.py"
      - "tests/statistics/test_advanced_volatility_estimators.py"
      - "tests/statistics/test_governance_runtime.py"
      - "tests/statistics/test_hsmm_hawkes_dependence_replay.py"
      - "tests/statistics/test_synthetic_market_validation.py"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Format quantitative implementation and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==25.12.0
          black aitos/statistics/depth_replay.py aitos/statistics/duration.py aitos/statistics/advanced_models.py aitos/statistics/governance_runtime.py aitos/statistics/hawkes.py aitos/statistics/selection.py tests/intelligence/test_candidate_outcome_attribution.py tests/statistics/test_advanced_volatility_estimators.py tests/statistics/test_governance_runtime.py tests/statistics/test_hsmm_hawkes_dependence_replay.py tests/statistics/test_synthetic_market_validation.py
      - name: Package formatted files
        run: |
          mkdir -p /tmp/quant-format
          cp --parents aitos/statistics/depth_replay.py aitos/statistics/duration.py aitos/statistics/advanced_models.py aitos/statistics/governance_runtime.py aitos/statistics/hawkes.py aitos/statistics/selection.py tests/intelligence/test_candidate_outcome_attribution.py tests/statistics/test_advanced_volatility_estimators.py tests/statistics/test_governance_runtime.py tests/statistics/test_hsmm_hawkes_dependence_replay.py tests/statistics/test_synthetic_market_validation.py /tmp/quant-format/
          tar -czf quant-formatted-sources.tar.gz -C /tmp/quant-format .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: quant-formatted-sources
          path: quant-formatted-sources.tar.gz
          retention-days: 1
