name: Production VPS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_audit_key
          chmod 600 /tmp/aitos_audit_key

      - name: Run canonical read-only audit on VPS
        id: audit
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_audit_key
          command_timeout: 10m
          script: |
            set -u
            cd "$HOME/aitos"
            test -f scripts/paper_runtime_audit.sh
            mkdir -p "$HOME/aitos-production-audit"
            REPORT="$HOME/aitos-production-audit/report.txt"
            EXIT_CODE="$HOME/aitos-production-audit/exit_code"
            set +e
            bash scripts/paper_runtime_audit.sh >"$REPORT" 2>&1
            status=$?
            set -e

            # The canonical audit remains the source of blocker status.
            # These observability sections are deliberately non-blocking and
            # are collected even when the canonical audit itself fails early.
            {
              echo
              echo '--- Live scanner freshness diagnostics (last 30m) ---'
              freshness_logs="$(docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'live scanner freshness' || true)"
              if [ -n "$freshness_logs" ]; then
                printf '%s\n' "$freshness_logs" | tail -n 200
              else
                echo 'NO live scanner freshness diagnostics found in the requested window.'
              fi
              echo
              echo '--- Live scanner freshness summary ---'
              freshness_count="$(printf '%s\n' "$freshness_logs" | grep -c 'live scanner freshness' || true)"
              echo "live scanner freshness entries in last 30m: $freshness_count"

              echo
              echo '--- Paper signal diagnostics (last 30m) ---'
              paper_logs="$(docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'paper signal diagnostics' || true)"
              if [ -n "$paper_logs" ]; then
                printf '%s\n' "$paper_logs" | tail -n 200
              else
                echo 'NO paper signal diagnostics found in the requested window.'
              fi
              echo
              echo '--- Paper signal diagnostics summary ---'
              paper_count="$(printf '%s\n' "$paper_logs" | grep -c 'paper signal diagnostics' || true)"
              echo "paper signal diagnostic entries in last 30m: $paper_count"
              echo 'Expected fields: symbol, market_source, live_fresh, executed_trades, structure, candle_cvd, orderflow_bias, orderflow_delta, orderflow_cvd, orderflow_buy_ratio, orderflow_aggression, orderflow_vwap, liquidity_quality, depth_imbalance, liquidity_wall, sweep_potential, absorption_proxy, liquidity_score, direction, scanner_threshold.'

              echo
              echo '--- Scanner score-breakdown diagnostics (last 30m) ---'
              score_logs="$(docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'scanner score breakdown' || true)"
              if [ -n "$score_logs" ]; then
                printf '%s\n' "$score_logs" | tail -n 200
              else
                echo 'NO scanner score breakdown diagnostics found in the requested window.'
                echo 'This means the scanner cycle did not produce a directional candidate in the window, or the deployed image predates score-breakdown instrumentation.'
              fi
              echo
              echo '--- Scanner score-breakdown summary ---'
              score_count="$(printf '%s\n' "$score_logs" | grep -c 'scanner score breakdown' || true)"
              echo "scanner score breakdown entries in last 30m: $score_count"
              echo 'Expected fields: symbol, direction, raw_component_scores, weights, weighted_contributions, weight_total, normalized_score, threshold, threshold_pass.'

              echo
              echo '--- Scanner ranking / trade decision diagnostics (last 30m) ---'
              decision_logs="$(docker logs --since 30m --timestamps aitos-paper 2>&1 | grep -E 'scanner ranking decision|trade candidate rejected by kernel|trade candidate skipped|trade candidate submitted' || true)"
              if [ -n "$decision_logs" ]; then
                printf '%s\n' "$decision_logs" | tail -n 200
              else
                echo 'NO scanner ranking/trade decision diagnostics found in the requested window.'
              fi
              echo
              echo '--- Scanner ranking / trade decision summary ---'
              decision_count="$(printf '%s\n' "$decision_logs" | grep -Ec 'scanner ranking decision|trade candidate rejected by kernel|trade candidate skipped|trade candidate submitted' || true)"
              echo "scanner ranking/trade decision entries in last 30m: $decision_count"
            } >>"$REPORT"

            printf '%s\n' "$status" > "$EXIT_CODE"
            test -s "$REPORT"
            exit "$status"

      - name: Retrieve audit report from VPS
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p aitos-production-audit
          scp \
            -i /tmp/aitos_audit_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-production-audit/report.txt" \
            aitos-production-audit/report.txt
          scp \
            -i /tmp/aitos_audit_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-production-audit/exit_code" \
            aitos-production-audit/exit_code
          test -s aitos-production-audit/report.txt
          test -s aitos-production-audit/exit_code

      - name: Print audit report to workflow log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s aitos-production-audit/report.txt
          echo '============================================================'
          echo ' AITOS PRODUCTION AUDIT REPORT'
          echo ' Full report retrieved from VPS'
          echo '============================================================'
          cat aitos-production-audit/report.txt
          echo '============================================================'
          echo ' AITOS PRODUCTION AUDIT REPORT END'
          echo '============================================================'

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-production-audit
          path: aitos-production-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Finalize audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(tr -d '[:space:]' < aitos-production-audit/exit_code)"
          case "$status" in
            0)
              echo "Production VPS audit completed successfully."
              ;;
            ''|*[!0-9]*)
              echo "Invalid audit exit code: $status"
              exit 1
              ;;
            *)
              echo "Production VPS audit reported failure: exit code $status"
              exit "$status"
              ;;
          esac

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/aitos_audit_key
