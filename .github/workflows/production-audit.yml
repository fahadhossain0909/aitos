name: Production VPS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_audit_key
          chmod 600 /tmp/aitos_audit_key

      - name: Run canonical read-only audit on VPS
        id: audit
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_audit_key
          command_timeout: 10m
          script: |
            set -u
            cd "$HOME/aitos"
            test -f scripts/paper_runtime_audit.sh
            mkdir -p "$HOME/aitos-production-audit"
            REPORT="$HOME/aitos-production-audit/report.txt"
            EXIT_CODE="$HOME/aitos-production-audit/exit_code"
            set +e
            bash scripts/paper_runtime_audit.sh >"$REPORT" 2>&1
            status=$?
            set -e

            # The canonical audit above remains the source of blocker status.
            # Append non-blocking observability sections so stale live state can
            # be classified even when no new market events are arriving.
            {
              echo
              echo '--- Live scanner freshness diagnostics (last 30m) ---'
              freshness_logs="$(docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'live scanner freshness' || true)"
              if [ -n "$freshness_logs" ]; then
                printf '%s\n' "$freshness_logs" | tail -n 200
              else
                echo 'NO live scanner freshness diagnostics found in the requested window.'
              fi
              echo
              echo '--- Live scanner freshness summary ---'
              freshness_count="$(printf '%s\n' "$freshness_logs" | grep -c 'live scanner freshness' || true)"
              echo "live scanner freshness entries in last 30m: $freshness_count"
              echo 'Expected fields: symbol, cache_has_state, trade_age_sec, book_age_sec, trade_consumer_lag_sec, book_consumer_lag_sec, last_trade_at, last_book_at.'

              echo
              echo '--- Scanner score-breakdown diagnostics (last 30m) ---'
              score_logs="$(docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'scanner score breakdown' || true)"
              if [ -n "$score_logs" ]; then
                printf '%s\n' "$score_logs" | tail -n 200
              else
                echo 'NO scanner score breakdown diagnostics found in the requested window.'
                echo 'Score-breakdown instrumentation is not yet wired into the scanner execution path.'
              fi
              echo
              echo '--- Scanner score-breakdown summary ---'
              score_count="$(printf '%s\n' "$score_logs" | grep -c 'scanner score breakdown' || true)"
              echo "scanner score breakdown entries in last 30m: $score_count"
              echo 'Expected fields: symbol, raw component score, weight, weighted contribution, weight_total, normalized_score, threshold.'
            } >>"$REPORT"

            printf '%s\n' "$status" > "$EXIT_CODE"
            test -s "$REPORT"
            exit "$status"

      - name: Retrieve audit report from VPS
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p aitos-production-audit
          scp \
            -i /tmp/aitos_audit_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-production-audit/report.txt" \
            aitos-production-audit/report.txt
          scp \
            -i /tmp/aitos_audit_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-production-audit/exit_code" \
            aitos-production-audit/exit_code
          test -s aitos-production-audit/report.txt
          test -s aitos-production-audit/exit_code

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-production-audit
          path: aitos-production-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Finalize audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(tr -d '[:space:]' < aitos-production-audit/exit_code)"
          case "$status" in
            0)
              echo "Production VPS audit completed successfully."
              ;;
            ''|*[!0-9]*)
              echo "Invalid audit exit code: $status"
              exit 1
              ;;
            *)
              echo "Production VPS audit reported failure: exit code $status"
              exit "$status"
              ;;
          esac

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/aitos_audit_key
