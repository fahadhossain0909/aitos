name: Production VPS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_audit_key
          chmod 600 /tmp/aitos_audit_key

      - name: Run canonical read-only audit on VPS
        id: audit
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_audit_key
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -u
            cd "$HOME/aitos"
            test -f scripts/paper_runtime_audit.sh
            mkdir -p "$HOME/aitos-production-audit"
            REPORT="$HOME/aitos-production-audit/report.txt"
            set +e
            bash scripts/paper_runtime_audit.sh >"$REPORT" 2>&1
            status=$?
            set -e
            printf 'AUDIT_EXIT_CODE=%s\n' "$status"
            printf 'AUDIT_REPORT_B64='
            base64 -w 0 "$REPORT"
            printf '\n'
            exit "$status"

      - name: Write audit report
        if: always()
        shell: bash
        env:
          AUDIT_OUTPUT: ${{ steps.audit.outputs.stdout }}
        run: |
          set -euo pipefail
          mkdir -p aitos-production-audit
          encoded="$(printf '%s\n' "$AUDIT_OUTPUT" | sed -n 's/^AUDIT_REPORT_B64=//p' | tail -n 1)"
          if [ -n "$encoded" ]; then
            printf '%s' "$encoded" | base64 --decode > aitos-production-audit/report.txt
          else
            printf '%s\n' "Audit output was unavailable. Inspect the workflow log." > aitos-production-audit/report.txt
          fi
          test -s aitos-production-audit/report.txt

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-production-audit
          path: aitos-production-audit/report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/aitos_audit_key
