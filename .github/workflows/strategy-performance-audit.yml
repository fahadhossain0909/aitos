name: Strategy Performance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  strategy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_strategy_audit_key
          chmod 600 /tmp/aitos_strategy_audit_key

      - name: Run strategy performance audit on VPS
        id: audit
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_strategy_audit_key
          command_timeout: 10m
          script: |
            set -u
            cd "$HOME/aitos"
            mkdir -p "$HOME/aitos-strategy-audit"
            REPORT="$HOME/aitos-strategy-audit/report.txt"
            EXIT_CODE="$HOME/aitos-strategy-audit/exit_code"
            : > "$REPORT"
            status=0

            {
              echo '=== AITOS STRATEGY PERFORMANCE AUDIT ==='
              echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo 'Purpose: strategy behaviour, execution, exits and PnL; non-blocking observational audit.'
              echo 'Observation window: 24h for strategy funnel and lifecycle logs.'
              echo

              echo '--- 1. TRADE LIFECYCLE SNAPSHOT ---'
              if docker inspect aitos-clickhouse >/dev/null 2>&1; then
                docker exec aitos-clickhouse clickhouse-client --query "SELECT state, countDistinct(trade_id) AS trades FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) GROUP BY state ORDER BY state FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Trade lifecycle query failed.'; status=1; }
                echo
                echo 'Open positions (position_opened / exit_triggered):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT trade_id, symbol, side, strategy_id, entry_price, sl_price, tp_price, state, entry_time, recorded_at AS updated_at FROM (SELECT trade_id, symbol, side, strategy_id, entry_price, sl_price, tp_price, state, entry_time, exit_time, recorded_at FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state IN ('position_opened','exit_triggered') ORDER BY entry_time FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Open-trade query failed.'; status=1; }
                echo
                echo 'Orders submitted but not yet opened:'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT trade_id, symbol, side, strategy_id, entry_price, sl_price, tp_price, state, entry_time FROM (SELECT trade_id, symbol, side, strategy_id, entry_price, sl_price, tp_price, state, entry_time, exit_time, recorded_at FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='order_submitted' ORDER BY entry_time FORMAT PrettyCompactMonoBlock" 2>&1 || true
              else
                echo 'ClickHouse container unavailable.'
                status=1
              fi
              echo

              echo '--- 2. CLOSED TRADE PERFORMANCE ---'
              if docker inspect aitos-clickhouse >/dev/null 2>&1; then
                echo 'All-time closed trades:'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT count() AS closed_trades, round(sum(ifNull(pnl,0)),4) AS net_pnl, round(avgIf(pnl, pnl IS NOT NULL),4) AS avg_pnl, round(sumIf(pnl,pnl>0),4) AS gross_profit, round(sumIf(pnl,pnl<0),4) AS gross_loss, round(100*countIf(pnl>0)/countIf(pnl IS NOT NULL),2) AS win_rate_pct FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'All-time performance query failed.'; status=1; }
                echo
                echo 'Last 24h closed trades:'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT count() AS closed_trades, round(sum(ifNull(pnl,0)),4) AS net_pnl, round(avgIf(pnl,pnl IS NOT NULL),4) AS avg_pnl, round(sumIf(pnl,pnl>0),4) AS gross_profit, round(sumIf(pnl,pnl<0),4) AS gross_loss, round(100*countIf(pnl>0)/countIf(pnl IS NOT NULL),2) AS win_rate_pct FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' AND parseDateTimeBestEffortOrNull(exit_time) >= now()-INTERVAL 24 HOUR FORMAT PrettyCompactMonoBlock" 2>&1 || { echo '24h performance query failed.'; status=1; }
                echo
                echo 'Exit reason breakdown (all-time):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT ifNull(exit_reason,'UNKNOWN') AS exit_reason, count() AS trades, round(sum(ifNull(pnl,0)),4) AS net_pnl, round(avgIf(pnl,pnl IS NOT NULL),4) AS avg_pnl, round(100*countIf(pnl>0)/countIf(pnl IS NOT NULL),2) AS win_rate_pct FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' GROUP BY exit_reason ORDER BY trades DESC FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Exit-reason query failed.'; status=1; }
                echo
                echo 'Symbol / side performance (all-time):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT symbol, side, count() AS trades, round(sum(ifNull(pnl,0)),4) AS net_pnl, round(avgIf(pnl,pnl IS NOT NULL),4) AS avg_pnl, round(100*countIf(pnl>0)/countIf(pnl IS NOT NULL),2) AS win_rate_pct FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' GROUP BY symbol, side ORDER BY net_pnl DESC FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Symbol performance query failed.'; status=1; }
                echo
                echo 'Recent closed trades (last 20):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT trade_id, symbol, side, strategy_id, entry_price, exit_price, sl_price, tp_price, exit_reason, round(pnl,4) AS pnl, round(pnl_percent,4) AS pnl_percent, entry_time, exit_time FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' ORDER BY parseDateTimeBestEffortOrNull(exit_time) DESC LIMIT 20 FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Recent closed-trades query failed.'; status=1; }
              fi
              echo

              echo '--- 3. RISK / R-MULTIPLE VIEW ---'
              if docker inspect aitos-clickhouse >/dev/null 2>&1; then
                docker exec aitos-clickhouse clickhouse-client --query "SELECT exit_reason, count() AS trades, round(avgIf(pnl/risk_amount_usd, risk_amount_usd>0 AND pnl IS NOT NULL),3) AS avg_R, round(sumIf(pnl/risk_amount_usd, risk_amount_usd>0 AND pnl IS NOT NULL),3) AS total_R FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' GROUP BY exit_reason ORDER BY trades DESC FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'R-multiple query failed.'; status=1; }
                echo
                echo 'Worst closed trades (by PnL):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT trade_id, symbol, side, exit_reason, round(pnl,4) AS pnl, round(pnl/risk_amount_usd,3) AS R, entry_price, exit_price, sl_price, tp_price FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' AND pnl IS NOT NULL ORDER BY pnl ASC LIMIT 10 FORMAT PrettyCompactMonoBlock" 2>&1 || true
              fi
              echo

              echo '--- 4. STRATEGY / CANDIDATE FUNNEL (LAST 24h) ---'
              echo 'Candidate and kernel decision logs:'
              decision_logs="$(docker logs --since 24h --timestamps aitos-paper 2>&1 | grep -E 'scanner ranking decision|scanner score breakdown|trade candidate rejected by kernel|trade candidate skipped|trade candidate submitted' || true)"
              if [ -n "$decision_logs" ]; then
                printf '%s\n' "$decision_logs" | tail -n 500
              else
                echo 'No candidate/decision logs found.'
              fi
              echo
              echo 'Funnel counts:'
              printf '%s\n' "$decision_logs" | grep -c 'scanner score breakdown' | xargs printf '  score breakdowns: %s\n' || true
              printf '%s\n' "$decision_logs" | grep -c 'trade candidate rejected by kernel' | xargs printf '  kernel rejections: %s\n' || true
              printf '%s\n' "$decision_logs" | grep -c 'trade candidate submitted' | xargs printf '  submitted: %s\n' || true
              echo

              echo '--- 5. TRADE LIFECYCLE LOG EVENTS (LAST 24h) ---'
              lifecycle_logs="$(docker logs --since 24h --timestamps aitos-paper 2>&1 | grep -E 'trade.*(submitted|opened|closed|exit|stop.?loss|take.?profit|trailing)|position.*(opened|closed|exit)' || true)"
              if [ -n "$lifecycle_logs" ]; then
                printf '%s\n' "$lifecycle_logs" | tail -n 500
              else
                echo 'No matching trade lifecycle log events found.'
              fi
              echo

              echo '--- 6. EXCURSION TELEMETRY ---'
              echo 'MAE/MFE availability and aggregate statistics (last 24h):'
              if docker inspect aitos-clickhouse >/dev/null 2>&1; then
                docker exec aitos-clickhouse clickhouse-client --query "SELECT count() AS closed_trades, countIf(mae_price IS NOT NULL) AS trades_with_mae, countIf(mfe_price IS NOT NULL) AS trades_with_mfe, round(100*countIf(mae_price IS NOT NULL)/count(),2) AS mae_coverage_pct, round(100*countIf(mfe_price IS NOT NULL)/count(),2) AS mfe_coverage_pct, round(avgIf(mae_price, mae_price IS NOT NULL),6) AS avg_mae_price, round(avgIf(mfe_price, mfe_price IS NOT NULL),6) AS avg_mfe_price, round(avgIf(mae_r, mae_r IS NOT NULL),4) AS avg_mae_R, round(avgIf(mfe_r, mfe_r IS NOT NULL),4) AS avg_mfe_R, round(quantileExactIf(0.5)(mae_price, mae_price IS NOT NULL),6) AS median_mae_price, round(quantileExactIf(0.5)(mfe_price, mfe_price IS NOT NULL),6) AS median_mfe_price, round(quantileExactIf(0.5)(mae_r, mae_r IS NOT NULL),4) AS median_mae_R, round(quantileExactIf(0.5)(mfe_r, mfe_r IS NOT NULL),4) AS median_mfe_R FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' AND parseDateTimeBestEffortOrNull(exit_time) >= now()-INTERVAL 24 HOUR FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'MAE/MFE aggregate query failed.'; status=1; }
                echo
                echo 'Strategy-wise MAE/MFE (last 24h):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT strategy_id, count() AS trades, countIf(mae_r IS NOT NULL) AS mae_samples, countIf(mfe_r IS NOT NULL) AS mfe_samples, round(100*countIf(mae_r IS NOT NULL)/count(),2) AS mae_coverage_pct, round(100*countIf(mfe_r IS NOT NULL)/count(),2) AS mfe_coverage_pct, round(avgIf(mae_r, mae_r IS NOT NULL),4) AS avg_mae_R, round(avgIf(mfe_r, mfe_r IS NOT NULL),4) AS avg_mfe_R, round(quantileExactIf(0.5)(mae_r, mae_r IS NOT NULL),4) AS median_mae_R, round(quantileExactIf(0.5)(mfe_r, mfe_r IS NOT NULL),4) AS median_mfe_R FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' AND parseDateTimeBestEffortOrNull(exit_time) >= now()-INTERVAL 24 HOUR GROUP BY strategy_id ORDER BY trades DESC FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Strategy MAE/MFE query failed.'; status=1; }
                echo
                echo 'Recent closed trades with MAE/MFE (last 20):'
                docker exec aitos-clickhouse clickhouse-client --query "SELECT trade_id, symbol, side, strategy_id, round(mae_price,6) AS mae_price, round(mfe_price,6) AS mfe_price, round(mae_r,4) AS mae_R, round(mfe_r,4) AS mfe_R, round(pnl,4) AS pnl, exit_reason, exit_time FROM (SELECT * FROM aitos.trades ORDER BY trade_id, recorded_at DESC, parseDateTimeBestEffortOrNull(exit_time) DESC, parseDateTimeBestEffortOrNull(entry_time) DESC LIMIT 1 BY trade_id) WHERE state='position_closed' AND parseDateTimeBestEffortOrNull(exit_time) >= now()-INTERVAL 24 HOUR ORDER BY parseDateTimeBestEffortOrNull(exit_time) DESC LIMIT 20 FORMAT PrettyCompactMonoBlock" 2>&1 || { echo 'Recent MAE/MFE query failed.'; status=1; }
              else
                echo 'ClickHouse container unavailable; MAE/MFE unavailable.'
                status=1
              fi
              echo

              echo '--- 7. DATA QUALITY NOTES ---'
              echo 'Trade records are append-only snapshots. Current-state selection uses recorded_at first, with exit_time and entry_time as deterministic fallbacks for legacy rows whose recorded_at may be identical or epoch.'
              echo 'This audit does not alter trading state and does not change blocker status.'
            } > "$REPORT" 2>&1 || status=1

            printf '%s\n' "$status" > "$EXIT_CODE"
            test -s "$REPORT"
            exit "$status"

      - name: Retrieve strategy audit report
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p aitos-strategy-audit
          scp -i /tmp/aitos_strategy_audit_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST:aitos-strategy-audit/report.txt" aitos-strategy-audit/report.txt
          scp -i /tmp/aitos_strategy_audit_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST:aitos-strategy-audit/exit_code" aitos-strategy-audit/exit_code
          test -s aitos-strategy-audit/report.txt
          test -s aitos-strategy-audit/exit_code

      - name: Print strategy audit report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat aitos-strategy-audit/report.txt

      - name: Upload strategy audit artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-strategy-performance-audit
          path: aitos-strategy-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Finalize audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(tr -d '[:space:]' < aitos-strategy-audit/exit_code)"
          case "$status" in
            0) echo 'Strategy performance audit completed.' ;;
            ''|*[!0-9]*) echo "Invalid audit exit code: $status"; exit 1 ;;
            *) echo "Strategy performance audit reported query/runtime issues: exit code $status"; exit "$status" ;;
          esac

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/aitos_strategy_audit_key
