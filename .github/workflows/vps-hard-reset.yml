name: HARD RESET VPS

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type HARD_RESET_VPS to permanently wipe AITOS Docker/data state on the VPS'
        required: true
        type: string
      reboot:
        description: 'Reboot the VPS after cleanup'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DEPLOY_PATH: /home/n41/aitos
  AITOS_DATA_ROOT: /mnt/aitos-data

concurrency:
  group: aitos-vps-hard-reset
  cancel-in-progress: false

jobs:
  hard-reset:
    name: Wipe AITOS VPS Docker + data state
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Verify destructive confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "HARD_RESET_VPS" ]; then
            echo '::error::Confirmation mismatch. Nothing was changed.'
            exit 1
          fi

      - name: Check SSH secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_vps_reset_key
          chmod 600 /tmp/aitos_vps_reset_key

      - name: HARD RESET VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          AITOS_DATA_ROOT: ${{ env.AITOS_DATA_ROOT }}
          REBOOT: ${{ inputs.reboot }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_vps_reset_key
          command_timeout: 20m
          envs: CONFIRMATION,DEPLOY_PATH,AITOS_DATA_ROOT,REBOOT
          script: |
            set -euo pipefail
            [ "$CONFIRMATION" = "HARD_RESET_VPS" ] || { echo 'Refusing destructive operation'; exit 2; }
            [ "$(id -u)" -eq 0 ] || { echo '::error::DEPLOY_USER must have root privileges for hard reset'; exit 1; }
            [ "$DEPLOY_PATH" = /home/n41/aitos ] || { echo '::error::Unexpected deployment path'; exit 1; }
            [ "$AITOS_DATA_ROOT" = /mnt/aitos-data ] || { echo '::error::Unexpected data root'; exit 1; }
            exec 9> /var/lock/aitos-vps-hard-reset.lock
            flock -n 9 || { echo '::error::Another VPS reset is already running'; exit 1; }

            echo '=== PRE-RESET INVENTORY ==='
            hostname || true
            df -h || true
            docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' 2>/dev/null || true
            docker system df 2>/dev/null || true

            echo '=== STOPPING AITOS COMPOSE ==='
            if [ -d "$DEPLOY_PATH" ]; then
              cd "$DEPLOY_PATH"
              if docker compose config >/dev/null 2>&1; then
                docker compose down --remove-orphans --volumes --timeout 30 || true
              fi
            fi

            echo '=== STOPPING REMAINING AITOS CONTAINERS ==='
            docker ps -aq --filter 'name=aitos-' | xargs -r docker rm -f || true

            echo '=== REMOVING AITOS IMAGES ==='
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk '$1 ~ /^(aitos|ghcr\.io\/fahadhossain0909\/aitos)([:/]|$)/ {print $2}' | sort -u | xargs -r docker rmi -f || true

            echo '=== REMOVING AITOS VOLUMES ==='
            docker volume ls -q | grep -E '(^|_)aitos([_-]|$)' | xargs -r docker volume rm -f || true

            echo '=== REMOVING AITOS NETWORKS ==='
            docker network ls --format '{{.Name}}' | grep -E '(^|_)aitos([_-]|$)' | xargs -r docker network rm || true

            echo '=== REMOVING DEPLOYMENT TREE ==='
            if [ -d "$DEPLOY_PATH" ]; then
              find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            fi

            echo '=== REMOVING AITOS DATA TREE ==='
            if [ -d "$AITOS_DATA_ROOT" ]; then
              find "$AITOS_DATA_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            fi

            echo '=== PRUNING UNUSED DOCKER STATE ==='
            docker system prune -af --volumes
            docker builder prune -af || true

            echo '=== POST-RESET VERIFICATION ==='
            test ! -d "$DEPLOY_PATH" || [ -z "$(find "$DEPLOY_PATH" -mindepth 1 -print -quit 2>/dev/null)" ]
            test ! -d "$AITOS_DATA_ROOT" || [ -z "$(find "$AITOS_DATA_ROOT" -mindepth 1 -print -quit 2>/dev/null)" ]
            test -z "$(docker ps -aq --filter 'name=aitos-')"
            docker system df || true
            df -h || true
            echo 'HARD_RESET_VPS completed: AITOS Docker resources, deployment tree, and AITOS data tree are empty.'

            if [ "$REBOOT" = "true" ]; then
              echo '=== REBOOTING VPS ==='
              nohup sh -c 'sleep 2; systemctl reboot' >/dev/null 2>&1 &
            fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/aitos_vps_reset_key
