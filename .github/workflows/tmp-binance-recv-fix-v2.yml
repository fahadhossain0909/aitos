name: Temporary Binance recv fix v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/binance-explicit-recv-v2
      - name: Apply explicit recv loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aitos/exchange/binance.py')
          s = p.read_text()
          old = '                        async for raw_message in ws:\n'
          new = '                        while True:\n                            raw_message = await ws.recv()\n'
          assert s.count(old) == 1, f'expected one receive loop, found {s.count(old)}'
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aitos/exchange/binance.py
          git commit -m 'fix: use explicit websocket recv for Binance transport'
          git push origin HEAD:fix/binance-explicit-recv-v2
