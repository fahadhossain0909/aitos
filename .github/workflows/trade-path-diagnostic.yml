name: Trade Path Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_trace_key
          chmod 600 /tmp/aitos_trace_key

      - name: Run read-only canonical trade path diagnostic
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_trace_key
          command_timeout: 8m
          script: |
            set -euo pipefail
            REDIS_CONTAINER="aitos-redis"
            PAPER_CONTAINER="aitos-paper"
            TRADE_STREAM="stream:market.trade"
            BOOK_STREAM="stream:market.book.snapshot"
            SCANNER_GROUP="market-scanner"
            rcli() { docker exec "$REDIS_CONTAINER" redis-cli "$@"; }
            echo '=== AITOS canonical trade-path diagnostic (READ ONLY) ==='
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for key in "$TRADE_STREAM" "$BOOK_STREAM"; do
              echo "--- ${key} ---"
              echo "XLEN=$(rcli XLEN "$key" 2>/dev/null || echo MISSING)"
              echo 'LATEST_ENTRY:'
              rcli --json XREVRANGE "$key" + - COUNT 1 2>/dev/null || true
              echo 'CONSUMER_GROUPS:'
              rcli XINFO GROUPS "$key" 2>/dev/null || true
              echo "SCANNER_GROUP=${SCANNER_GROUP}"
              rcli XINFO CONSUMERS "$key" "$SCANNER_GROUP" 2>/dev/null || true
              pending="$(rcli XPENDING "$key" "$SCANNER_GROUP" 2>/dev/null | awk 'NR==1 {print $1}' || echo 0)"
              echo "SCANNER_PENDING=${pending:-0}"
            done

            echo '--- Paper logs: canonical trade path markers (last 10m) ---'
            docker logs --since 10m --timestamps "$PAPER_CONTAINER" 2>&1 \
              | grep -E 'canonical scanner subscriptions initialized|canonical market-data runtime started|market-data websocket receive lag|live scanner freshness|paper signal diagnostics|trade downstream processing failed|trade state update failed|REST trade recovery failed' \
              | tail -n 500 || true

            echo '--- Legacy V2/V3 consumer-group audit ---'
            found_legacy=0
            while IFS= read -r key; do
              [ -n "$key" ] || continue
              groups="$(rcli XINFO GROUPS "$key" 2>/dev/null || true)"
              for legacy in live-scanner-trades-v2 live-scanner-book-v2 live-scanner-liquidity-v2 live-scanner-trades-v3 live-scanner-book-v3 live-scanner-liquidity-v3; do
                if printf '%s\n' "$groups" | grep -q "$legacy"; then
                  echo "BLOCKER: legacy group=${legacy} exists on stream=${key}"
                  found_legacy=1
                fi
              done
            done < <(rcli --scan --pattern 'stream:*' 2>/dev/null || true)
            if [ "$found_legacy" -eq 0 ]; then
              echo 'LEGACY_V2_V3_GROUPS=0'
            fi

            echo '--- Interpretation ---'
            echo '1. Canonical trade transport is stream:market.trade.'
            echo '2. Canonical book transport is stream:market.book.snapshot.'
            echo '3. market-scanner is the single live consumer group for trade/book.'
            echo '4. REST recovery is degraded/non-live and must never establish live freshness.'
            echo '5. Any V2/V3 consumer group indicates legacy topology is still active.'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/aitos_trace_key
