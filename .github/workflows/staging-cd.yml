name: Staging CD + Runtime Audit

on:
  push:
    branches:
      - 'architecture/**'
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'fix/production-readiness-hardening-2026-11'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aitos-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  AITOS_DATA_ROOT: /mnt/aitos-staging-data
  BOOT_FREE_RESERVE_BYTES: 8053063680
  DATA_DISK_MIN_FREE_GB: 20

jobs:
  publish-image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v7.0.1
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build immutable staging image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}:staging-sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

  deploy-and-audit:
    runs-on: ubuntu-latest
    needs: publish-image
    timeout-minutes: 110
    environment: staging
    steps:
      - name: Validate staging environment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing staging environment secret: $name"; exit 1; }
          done

      - name: Prepare staging SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_staging_key
          chmod 600 /tmp/aitos_staging_key

      - name: Deploy immutable branch image to staging
        uses: appleboy/ssh-action@v1.2.5
        env:
          AITOS_DATA_ROOT: ${{ env.AITOS_DATA_ROOT }}
          BOOT_FREE_RESERVE_BYTES: ${{ env.BOOT_FREE_RESERVE_BYTES }}
          DATA_DISK_MIN_FREE_GB: ${{ env.DATA_DISK_MIN_FREE_GB }}
          AITOS_DATA_DISK_UUID: ${{ secrets.AITOS_DATA_DISK_UUID }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AITOS_ALLOW_BOOT_DISK_DATA: 'true'
          AITOS_RUNTIME_IMAGE: ghcr.io/fahadhossain0909/aitos@${{ needs.publish-image.outputs.digest }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_staging_key
          command_timeout: 20m
          envs: AITOS_DATA_ROOT,BOOT_FREE_RESERVE_BYTES,DATA_DISK_MIN_FREE_GB,AITOS_DATA_DISK_UUID,REDIS_PASSWORD,CLICKHOUSE_PASSWORD,NEO4J_PASSWORD,GHCR_USERNAME,GHCR_TOKEN,AITOS_ALLOW_BOOT_DISK_DATA,AITOS_RUNTIME_IMAGE
          script: |
            set -Eeuo pipefail
            : "${AITOS_DATA_ROOT:=/mnt/aitos-staging-data}"
            : "${BOOT_FREE_RESERVE_BYTES:=8053063680}"
            : "${DATA_DISK_MIN_FREE_GB:=20}"
            : "${AITOS_ALLOW_BOOT_DISK_DATA:=true}"
            AITOS_DATA_DISK_UUID="${AITOS_DATA_DISK_UUID:-$(findmnt -rn -o UUID --target / | head -n1)}"
            APP_DIR="/opt/aitos-staging"
            REPO="${{ github.repository }}"
            COMMIT="${{ github.sha }}"
            IMAGE="ghcr.io/${REPO,,}:staging-sha-${COMMIT}"

            mkdir -p "$APP_DIR"
            exec 9>"$HOME/.aitos-staging-deploy.lock"
            flock 9

            echo '=== STAGING BOOT DISK PREFLIGHT ==='
            boot_free=$(df -B1 --output=avail "$HOME" | tail -1 | tr -d ' ')
            [ "$boot_free" -ge "$BOOT_FREE_RESERVE_BYTES" ] || { echo '::error::Staging boot disk below reserve; refusing destructive cleanup.'; exit 1; }

            echo '=== STAGING SOURCE DEPLOYMENT ==='
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL --retry 3 --retry-delay 2 "https://github.com/$REPO/archive/$COMMIT.tar.gz" -o "$tmp_dir/source.tar.gz"
            mkdir -p "$tmp_dir/source"
            tar -xzf "$tmp_dir/source.tar.gz" --strip-components=1 -C "$tmp_dir/source"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "$tmp_dir/source/." "$APP_DIR/"
            cd "$APP_DIR"

            echo '=== STAGING STORAGE BOOTSTRAP ==='
            export AITOS_DATA_ROOT AITOS_DATA_DISK_UUID AITOS_ALLOW_BOOT_DISK_DATA
            export AITOS_AUTO_RESET_DISPOSABLE_DATA=false
            export AITOS_HOST_UID="$(id -u)" AITOS_HOST_GID="$(id -g)"
            chmod +x scripts/bootstrap_storage.sh
            ./scripts/bootstrap_storage.sh
            test "$(findmnt -rn -o UUID --target "$AITOS_DATA_ROOT")" = "$(findmnt -rn -o UUID --target /)"

            echo '=== STAGING ENVIRONMENT ==='
            umask 077
            SECRETS_FILE="$HOME/.aitos-staging-secrets"
            saved_secret() { test -f "$SECRETS_FILE" && sed -n "s/^$1=//p" "$SECRETS_FILE" | tail -n 1 || true; }
            REDIS_PASSWORD="${REDIS_PASSWORD:-$(saved_secret REDIS_PASSWORD)}"
            CLICKHOUSE_PASSWORD="${CLICKHOUSE_PASSWORD:-$(saved_secret CLICKHOUSE_PASSWORD)}"
            NEO4J_PASSWORD="${NEO4J_PASSWORD:-$(saved_secret NEO4J_PASSWORD)}"
            REDIS_PASSWORD="${REDIS_PASSWORD:-$(openssl rand -hex 32)}"
            CLICKHOUSE_PASSWORD="${CLICKHOUSE_PASSWORD:-$(openssl rand -hex 32)}"
            NEO4J_PASSWORD="${NEO4J_PASSWORD:-$(openssl rand -hex 32)}"
            printf 'REDIS_PASSWORD=%s\nCLICKHOUSE_PASSWORD=%s\nNEO4J_PASSWORD=%s\n' "$REDIS_PASSWORD" "$CLICKHOUSE_PASSWORD" "$NEO4J_PASSWORD" > "$SECRETS_FILE"
            chmod 600 "$SECRETS_FILE"
            cat > .env << ENVEOF
            ENVIRONMENT=staging
            LOG_LEVEL=INFO
            REQUIRE_HUMAN_APPROVAL_FOR_PROD=true
            DEBUG=false
            TESTING=false
            AITOS_DATA_ROOT=$AITOS_DATA_ROOT
            AITOS_DATA_DISK_UUID=$AITOS_DATA_DISK_UUID
            AITOS_ALLOW_BOOT_DISK_DATA=true
            AITOS_AUTO_RESET_DISPOSABLE_DATA=false
            AITOS_PAPER_ACCOUNT_SCOPE=paper:staging
            AITOS_UID=1000
            AITOS_GID=1000
            LIVE_TRADING_ENABLED=false
            AITOS_LIVE_EXECUTION_ENABLED=false
            BINANCE_FUTURES_TESTNET_API_KEY=
            BINANCE_FUTURES_TESTNET_API_SECRET=
            AITOS_BINANCE_FUTURES_ENVIRONMENT=mainnet
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            REDIS_PASSWORD=$REDIS_PASSWORD
            REDIS_DATA_DIR=$AITOS_DATA_ROOT/eventbus/redis
            CLICKHOUSE_HOST=clickhouse
            CLICKHOUSE_PORT=8123
            CLICKHOUSE_USER=default
            CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
            CLICKHOUSE_DATABASE=aitos
            CLICKHOUSE_DB=aitos
            CLICKHOUSE_DATA_DIR=$AITOS_DATA_ROOT/databases/clickhouse
            NEO4J_URI=bolt://neo4j:7687
            NEO4J_USER=neo4j
            NEO4J_PASSWORD=$NEO4J_PASSWORD
            NEO4J_DATA_DIR=$AITOS_DATA_ROOT/databases/neo4j
            NEO4J_LOG_DIR=$AITOS_DATA_ROOT/runtime/logs/neo4j
            LEARNING_POLL_SECONDS=60
            LEARNING_LOOKBACK_HOURS=168
            LEARNING_MODEL_PATH=$AITOS_DATA_ROOT/runtime/models/online_rl/deep_value.pkl
            LEARNING_STATE_PATH=$AITOS_DATA_ROOT/runtime/models/online_rl/worker_state.json
            BACKTEST_DATA_DIR=$AITOS_DATA_ROOT/research/backtest
            REPLAY_DATA_DIR=$AITOS_DATA_ROOT/research/replay
            BACKUP_DIR=$AITOS_DATA_ROOT/artifacts/backups
            SNAPSHOT_DIR=$AITOS_DATA_ROOT/artifacts/snapshots
            MODEL_DATA_DIR=$AITOS_DATA_ROOT/runtime/models
            RUNTIME_TMP_DIR=$AITOS_DATA_ROOT/runtime/tmp
            ARTIFACTS_DATA_DIR=$AITOS_DATA_ROOT/artifacts
            AITOS_BOOT_RUNTIME_DIR=/var/lib/aitos
            BOOT_FREE_BUFFER_GB=7.5
            DATA_DISK_MIN_FREE_GB=$DATA_DISK_MIN_FREE_GB
            DATA_DISK_TARGET_FREE_GB=25
            BINANCE_API_KEY=
            BINANCE_API_SECRET=
            BINANCE_TESTNET=false
            BINANCE_RECV_WINDOW_MS=5000
            BINANCE_HEDGE_MODE=false
            APP_PORT=8001
            APP_HOST=0.0.0.0
            COMPOSE_PROJECT_NAME=aitos-staging
            AITOS_IMAGE=ghcr.io/${REPO,,}
            AITOS_IMAGE_TAG=staging-sha-${COMMIT}
            AITOS_RUNTIME_IMAGE=$AITOS_RUNTIME_IMAGE
            DATABASE_URL=
            SENTRY_DSN=
            ENVEOF
            chmod 600 .env

            echo '=== STAGING PATH ASSERTIONS ==='
            grep -q '^REDIS_DATA_DIR=/mnt/aitos-staging-data/eventbus/redis$' .env
            grep -q '^CLICKHOUSE_DATA_DIR=/mnt/aitos-staging-data/databases/clickhouse$' .env
            grep -q '^NEO4J_DATA_DIR=/mnt/aitos-staging-data/databases/neo4j$' .env
            ! grep -q '^AITOS_DATA_ROOT=/mnt/aitos-data$' .env
            ! grep -q '^COMPOSE_PROJECT_NAME=aitos$' .env

            echo '=== STAGING DOCKER DEPLOYMENT ==='
            docker compose config --format json > /tmp/aitos-staging-compose.json
            AITOS_REQUIRE_DIGEST_IMAGES=true python3 scripts/validate_compose_policy.py /tmp/aitos-staging-compose.json
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true; unset GHCR_TOKEN' EXIT
            docker compose pull
            docker logout ghcr.io || true
            trap - EXIT
            unset GHCR_TOKEN
            docker compose down --remove-orphans --timeout 30 || true
            docker compose up -d --remove-orphans --force-recreate

            echo '=== STAGING HEALTH GATE ==='
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              redis_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aitos-redis 2>/dev/null || true)
              clickhouse_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aitos-clickhouse 2>/dev/null || true)
              neo4j_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aitos-neo4j 2>/dev/null || true)
              if [ "$redis_state" = healthy ] && [ "$clickhouse_state" = healthy ] && [ "$neo4j_state" = healthy ]; then break; fi
              sleep 10
            done
            [ "$(docker inspect --format '{{.State.Health.Status}}' aitos-redis)" = healthy ]
            [ "$(docker inspect --format '{{.State.Health.Status}}' aitos-clickhouse)" = healthy ]
            [ "$(docker inspect --format '{{.State.Health.Status}}' aitos-neo4j)" = healthy ]
            bad_containers="$(docker compose ps --all --format '{{.Name}} {{.State}}' | awk '{state=tolower($2); if (state ~ /unhealthy|restarting/ || (state ~ /exited/ && $1 !~ /clickhouse-init/)) print}')"
            if [ -n "$bad_containers" ]; then printf '%s\n' "$bad_containers"; exit 1; fi

            echo '=== STAGING STORAGE GATE ==='
            test "$(findmnt -rn -o UUID --target "$AITOS_DATA_ROOT")" = "$(findmnt -rn -o UUID --target /)"
            df -h "$AITOS_DATA_ROOT"
            docker run --rm --user 0:0 -v "$AITOS_DATA_ROOT:/data" alpine:3.20 sh -ec '
              for path in databases/clickhouse databases/neo4j eventbus/redis/live eventbus/redis/archive research/backtest research/replay artifacts/backups artifacts/snapshots runtime/models runtime/logs/neo4j runtime/tmp; do
                test -d "/data/$path" || { echo "Missing persistent path: /data/$path"; exit 1; }
              done
            '
            echo "=== STAGING DEPLOYMENT SUCCESS: $COMMIT ==="

      - name: 90-minute staging paper soak
        id: staging_soak
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_staging_key
          command_timeout: 100m
          script: |
            set -Eeuo pipefail
            cd /opt/aitos-staging
            mkdir -p "$HOME/aitos-staging-audit"
            REPORT="$HOME/aitos-staging-audit/soak.txt"
            REDIS_PASSWORD="$(sed -n 's/^REDIS_PASSWORD=//p' .env | tail -n 1)"
            START="$(date +%s)"
            DEADLINE=$((START + 5400))
            CYCLE=0
            printf 'AITOS staging paper soak started: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
            echo "=== WAITING FOR PAPER STARTUP (max 300 seconds) ===" | tee -a "$REPORT"
            READY_DEADLINE=$((SECONDS + 300))
            PAPER_READY=false
            while [ "$SECONDS" -lt "$READY_DEADLINE" ]; do
              PAPER_STATE="$(docker inspect --format '{{.State.Status}}' aitos-paper 2>/dev/null || echo missing)"
              PAPER_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aitos-paper 2>/dev/null || echo missing)"
              printf 'startup_wait elapsed=%ss status=%s health=%s\n' "$((300 - (READY_DEADLINE - SECONDS)))" "$PAPER_STATE" "$PAPER_HEALTH" | tee -a "$REPORT"
              if [ "$PAPER_STATE" != running ]; then
                echo "Paper container is not running; collecting startup logs." | tee -a "$REPORT"
                docker logs --tail 300 --timestamps aitos-paper 2>&1 | tee -a "$REPORT" || true
                exit 1
              fi
              if [ "$PAPER_HEALTH" = healthy ]; then PAPER_READY=true; break; fi
              if [ "$PAPER_HEALTH" = unhealthy ]; then
                echo "Paper container healthcheck is unhealthy; collecting startup logs." | tee -a "$REPORT"
                docker inspect aitos-paper >> "$REPORT" 2>&1 || true
                docker logs --tail 300 --timestamps aitos-paper 2>&1 | tee -a "$REPORT" || true
                exit 1
              fi
              sleep 10
            done
            if [ "$PAPER_READY" != true ]; then
              echo "Paper container did not become healthy within 300 seconds." | tee -a "$REPORT"
              docker inspect aitos-paper >> "$REPORT" 2>&1 || true
              docker logs --tail 300 --timestamps aitos-paper 2>&1 | tee -a "$REPORT" || true
              exit 1
            fi
            echo "Paper health endpoint is ready; beginning 90-minute observation." | tee -a "$REPORT"
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              CYCLE=$((CYCLE + 1))
              {
                echo
                echo "=== SOAK CYCLE $CYCLE UTC $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                for container in aitos-redis aitos-clickhouse aitos-neo4j aitos-paper aitos-learning aitos-storage-maintenance aitos-redis-dlq-retention aitos-redis-stream-archive; do
                  status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || echo missing)"
                  health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || echo missing)"
                  restarts="$(docker inspect --format '{{.RestartCount}}' "$container" 2>/dev/null || echo 0)"
                  oom="$(docker inspect --format '{{.State.OOMKilled}}' "$container" 2>/dev/null || echo true)"
                  printf '%-34s status=%s health=%s restarts=%s oom=%s\n' "$container" "$status" "$health" "$restarts" "$oom"
                  if [ "$status" != running ] || [ "$health" = unhealthy ] || [ "$oom" = true ]; then
                    echo "SOAK BLOCKER: $container is not healthy"
                    docker logs --tail 200 --timestamps "$container" 2>&1 || true
                    exit 1
                  fi
                done
                curl -fsS http://127.0.0.1:8090/health >/dev/null
                echo "paper_health=ok"
                curl -fsS http://127.0.0.1:8090/metrics | grep -E '^(process_cpu_seconds_total|process_resident_memory_bytes|python_gc_objects_collected_total)' | head -n 12 || true
                echo "--- resource usage ---"
                docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
                echo "--- Redis persistence and market streams ---"
                docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" aitos-redis redis-cli INFO memory | grep -E '^(used_memory_human|maxmemory_human|mem_fragmentation_ratio):' || true
                for key in $(docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" aitos-redis redis-cli --raw --scan --pattern 'stream:market.*' | head -n 30); do
                  stream_length="$(docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" aitos-redis redis-cli XLEN "$key" 2>/dev/null || echo unavailable)"
                  printf '%s XLEN=%s\n' "$key" "$stream_length"
                done
                echo "--- paper market-data / decision activity (last 5m) ---"
                docker logs --since 5m --timestamps aitos-paper 2>&1 | grep -Ei 'websocket|market.?data|aggtrade|depth|order.?book|kline|live scanner freshness|paper signal diagnostics|scanner ranking decision|trade candidate' | tail -n 60 || true
                echo "--- persistent storage ---"
                df -h /mnt/aitos-staging-data
              } | tee -a "$REPORT"
              remaining=$((DEADLINE - $(date +%s)))
              if [ "$remaining" -gt 0 ]; then
                sleep_for=300
                [ "$remaining" -lt "$sleep_for" ] && sleep_for="$remaining"
                sleep "$sleep_for"
              fi
            done
            printf '\nSOAK_COMPLETE=true cycles=%s elapsed_seconds=%s completed_at=%s\n' "$CYCLE" "$(( $(date +%s) - START ))" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$REPORT"

      - name: Capture staging startup diagnostics
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_staging_key
          command_timeout: 5m
          script: |
            set +e
            mkdir -p "$HOME/aitos-staging-audit"
            REPORT="$HOME/aitos-staging-audit/startup-diagnostics.txt"
            {
              echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              cd /opt/aitos-staging
              docker compose ps --all 2>&1 || true
              for container in aitos-paper aitos-learning aitos-redis aitos-clickhouse aitos-neo4j; do
                echo "=== $container inspect ==="
                docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' "$container" 2>&1 || true
                echo "=== $container recent logs ==="
                docker logs --tail 400 --timestamps "$container" 2>&1 || true
              done
              echo "=== paper health ==="
              curl -v --max-time 10 http://127.0.0.1:8090/health 2>&1 || true
              echo "=== host resources ==="
              free -h
              df -h /
            } > "$REPORT" 2>&1
            cat "$REPORT"

      - name: Run read-only staging runtime audit
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_staging_key
          command_timeout: 10m
          script: |
            set -u
            cd "/opt/aitos-staging"
            test -f scripts/paper_runtime_audit.sh
            mkdir -p "$HOME/aitos-staging-audit"
            REPORT="$HOME/aitos-staging-audit/report.txt"
            EXIT_CODE="$HOME/aitos-staging-audit/exit_code"
            set +e
            AITOS_DATA_ROOT=/mnt/aitos-staging-data bash scripts/paper_runtime_audit.sh >"$REPORT" 2>&1
            status=$?
            set -e
            {
              echo
              echo '--- STAGING RUNTIME METADATA ---'
              echo "tested_commit=${{ github.sha }}"
              echo "tested_ref=${{ github.ref_name }}"
              echo "tested_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              echo '--- Live scanner freshness diagnostics (last 30m) ---'
              docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'live scanner freshness' | tail -n 200 || true
              echo
              echo '--- Paper signal diagnostics (last 30m) ---'
              docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'paper signal diagnostics' | tail -n 200 || true
              echo
              echo '--- Scanner score-breakdown diagnostics (last 30m) ---'
              docker logs --since 30m --timestamps aitos-paper 2>&1 | grep 'scanner score breakdown' | tail -n 200 || true
              echo
              echo '--- Scanner ranking / trade decision diagnostics (last 30m) ---'
              docker logs --since 30m --timestamps aitos-paper 2>&1 | grep -E 'scanner ranking decision|trade candidate rejected by kernel|trade candidate skipped|trade candidate submitted' | tail -n 200 || true
              echo
              echo '--- Container status ---'
              docker compose ps --all || true
            } >> "$REPORT"
            printf '%s\n' "$status" > "$EXIT_CODE"
            test -s "$REPORT"
            exit "$status"

      - name: Retrieve staging audit report
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p aitos-staging-audit
          if scp -i /tmp/aitos_staging_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST:aitos-staging-audit/report.txt" aitos-staging-audit/report.txt \
            && scp -i /tmp/aitos_staging_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST:aitos-staging-audit/exit_code" aitos-staging-audit/exit_code; then
            test -s aitos-staging-audit/report.txt
            test -s aitos-staging-audit/exit_code
          else
            printf 'Deployment stopped before runtime audit; inspect the SSH deployment step logs.\n' > aitos-staging-audit/report.txt
            printf '99\n' > aitos-staging-audit/exit_code
          fi
          if ! scp -i /tmp/aitos_staging_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST:aitos-staging-audit/soak.txt" aitos-staging-audit/soak.txt; then
            printf '90-minute soak did not produce a report.\n' > aitos-staging-audit/soak.txt
          fi
          if ! scp -i /tmp/aitos_staging_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST:aitos-staging-audit/startup-diagnostics.txt" aitos-staging-audit/startup-diagnostics.txt; then
            printf 'Startup diagnostics unavailable.\n' > aitos-staging-audit/startup-diagnostics.txt
          fi

      - name: Print staging audit report
        if: always()
        run: |
          cat aitos-staging-audit/report.txt
          cat aitos-staging-audit/soak.txt
          cat aitos-staging-audit/startup-diagnostics.txt

      - name: Upload staging audit artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-staging-audit-${{ github.sha }}
          path: aitos-staging-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce staging audit gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.staging_soak.outcome }}" != "success" ]; then
            echo "90-minute staging soak did not complete successfully."
            exit 1
          fi
          status="$(tr -d '[:space:]' < aitos-staging-audit/exit_code)"
          case "$status" in
            0) echo 'Staging runtime audit PASSED.' ;;
            ''|*[!0-9]*) echo "Invalid staging audit exit code: $status"; exit 1 ;;
            *) echo "Staging runtime audit FAILED: exit code $status"; exit "$status" ;;
          esac

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/aitos_staging_key
