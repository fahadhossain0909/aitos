name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  AITOS_DATA_ROOT: /mnt/aitos-data
  OTHERS_BUDGET_BYTES: 24159191040
  STORAGE_RESET_MARKER: .aitos-storage-reset-v1

jobs:
  publish-image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish-image
    environment: papertrade
    steps:
      - name: Check required deployment secrets
        id: check-secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY REDIS_PASSWORD CLICKHOUSE_PASSWORD NEO4J_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Write SSH key with proper formatting
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Check runner resources
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          free -h
          df -h /

      - name: Deploy pre-built image and reset stale VPS storage
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          OTHERS_BUDGET_BYTES: ${{ env.OTHERS_BUDGET_BYTES }}
          STORAGE_RESET_MARKER: ${{ env.STORAGE_RESET_MARKER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/deploy_key
          command_timeout: 15m
          envs: OTHERS_BUDGET_BYTES,STORAGE_RESET_MARKER
          script: |
            set -euo pipefail
            : "${OTHERS_BUDGET_BYTES:=24159191040}"
            : "${STORAGE_RESET_MARKER:=.aitos-storage-reset-v1}"

            APP_DIR="$HOME/aitos"
            DATA_ROOT="${{ env.AITOS_DATA_ROOT }}"
            REPO="${{ github.repository }}"
            COMMIT="${{ github.sha }}"
            MARKER="$HOME/$STORAGE_RESET_MARKER"
            TMP_ROOT=$(mktemp -d)
            trap 'rm -rf "$TMP_ROOT"' EXIT

            echo "=== Storage safety checks ==="
            if ! mountpoint -q "$DATA_ROOT"; then
              echo "::error::$DATA_ROOT is not a mounted data disk; refusing to touch database storage."
              exit 1
            fi
            if [ "$(findmnt -n -o FSTYPE --target "$DATA_ROOT")" = "" ]; then
              echo "::error::Could not determine filesystem for $DATA_ROOT."
              exit 1
            fi
            if ! sudo -n true 2>/dev/null; then
              echo "::error::Passwordless sudo is required for the one-time database storage reset."
              exit 1
            fi
            echo "Data disk: $(findmnt -n -o SOURCE,FSTYPE,SIZE,USED,AVAIL --target "$DATA_ROOT")"
            echo "Boot disk before cleanup: $(df -h "$HOME" | tail -1)"

            echo "=== Stopping AITOS containers before storage reset ==="
            docker ps -aq --filter 'name=^aitos-' | xargs -r docker rm -f

            echo "=== Removing old AITOS Docker volumes ==="
            docker volume ls -q --filter label=com.docker.compose.project=aitos | xargs -r docker volume rm || true
            docker volume rm aitos_aitos_model_data 2>/dev/null || true

            if [ ! -e "$MARKER" ]; then
              echo "=== ONE-TIME AITOS STORAGE RESET ==="
              echo "All previously accumulated AITOS database/application data is intentionally disposable for this pre-production reset."

              echo "--- Clearing mounted database disk as root ---"
              echo "Preserving filesystem metadata directory: lost+found"
              sudo find "$DATA_ROOT" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf -- {} +
              sudo mkdir -p "$DATA_ROOT/clickhouse" "$DATA_ROOT/neo4j" "$DATA_ROOT/redis"

              echo "--- Removing old AITOS application tree from boot disk ---"
              rm -rf -- "$APP_DIR"

              echo "--- Cleaning unused Docker storage ---"
              docker container prune --force || true
              docker image prune -a --force || true
              docker builder prune --all --force || true
              docker network prune --force || true

              touch "$MARKER"
              chmod 600 "$MARKER"
              echo "Storage reset completed and permanently marked at $MARKER"
            else
              echo "=== One-time storage reset already completed; preserving current persistent data ==="
            fi

            echo "=== Boot disk after cleanup ==="
            df -h "$HOME"
            docker system df
            echo "=== Database disk after cleanup ==="
            df -h "$DATA_ROOT"

            echo "=== Installing minimal deployment files ==="
            mkdir -p "$APP_DIR/docker/clickhouse/config.d" "$APP_DIR/docker/clickhouse/users.d"
            curl -fsSL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/$REPO/$COMMIT/docker-compose.yml" -o "$APP_DIR/docker-compose.yml"
            curl -fsSL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/$REPO/$COMMIT/docker/clickhouse/config.d/aitos.xml" -o "$APP_DIR/docker/clickhouse/config.d/aitos.xml"
            curl -fsSL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/$REPO/$COMMIT/docker/clickhouse/users.d/aitos.xml" -o "$APP_DIR/docker/clickhouse/users.d/aitos.xml"
            cd "$APP_DIR"

            mkdir -p ./.storage/others/backtest ./.storage/others/backups ./.storage/others/snapshots
            others_bytes=$(du -sb ./.storage/others | cut -f1)
            if [ "$others_bytes" -gt "$OTHERS_BUDGET_BYTES" ]; then
              echo "::error::Application data under ./.storage/others exceeds the 22.5 GiB budget."
              du -sh ./.storage/others
              exit 1
            fi

            umask 077
            cat > .env << 'ENVEOF'
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            REQUIRE_HUMAN_APPROVAL_FOR_PROD=true
            DEBUG=false
            TESTING=false
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DATA_DIR=${{ env.AITOS_DATA_ROOT }}/redis
            CLICKHOUSE_HOST=clickhouse
            CLICKHOUSE_PORT=8123
            CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER || 'default' }}
            CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            CLICKHOUSE_DATABASE=aitos
            CLICKHOUSE_DB=aitos
            CLICKHOUSE_DATA_DIR=${{ env.AITOS_DATA_ROOT }}/clickhouse
            NEO4J_URI=bolt://neo4j:7687
            NEO4J_USER=${{ secrets.NEO4J_USER || 'neo4j' }}
            NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            NEO4J_DATA_DIR=${{ env.AITOS_DATA_ROOT }}/neo4j
            NEO4J_LOG_DIR=./.storage/others/neo4j-logs
            LEARNING_POLL_SECONDS=60
            LEARNING_LOOKBACK_HOURS=168
            LEARNING_MODEL_PATH=/models/online_rl/deep_value.pkl
            LEARNING_STATE_PATH=/models/online_rl/worker_state.json
            BACKTEST_DATA_DIR=./.storage/others/backtest
            OTHERS_DATA_DIR=./.storage/others
            BACKUP_DIR=./.storage/others/backups
            SNAPSHOT_DIR=./.storage/others/snapshots
            BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
            BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }}
            BINANCE_TESTNET=${{ secrets.BINANCE_TESTNET || 'true' }}
            BINANCE_RECV_WINDOW_MS=5000
            BINANCE_HEDGE_MODE=false
            DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER=${{ secrets.DEPLOY_USER }}
            DEPLOY_PORT=${{ secrets.DEPLOY_PORT || '22' }}
            APP_PORT=8000
            APP_HOST=0.0.0.0
            COMPOSE_PROJECT_NAME=aitos
            AITOS_IMAGE=ghcr.io/fahadhossain0909/aitos
            AITOS_IMAGE_TAG=sha-${{ github.sha }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            ENVEOF
            chmod 600 .env

            echo "=== Compose validation ==="
            docker compose config > /dev/null
            docker info --format 'Server={{.ServerVersion}} StorageDriver={{.Driver}} OSType={{.OSType}}'
            docker system df

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin
            docker compose pull
            docker compose down --remove-orphans --timeout 30 || true

            echo "=== ISOLATED CLICKHOUSE STARTUP READINESS GATE ==="
            docker compose up -d clickhouse
            ch_health=""
            ch_status="missing"
            ch_deadline=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$ch_deadline" ]; do
              ch_status=$(docker inspect --format='{{.State.Status}}' aitos-clickhouse 2>/dev/null || echo missing)
              ch_health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aitos-clickhouse 2>/dev/null || echo missing)
              echo "aitos-clickhouse: status=$ch_status health=$ch_health"
              if [ "$ch_health" = "healthy" ]; then break; fi
              if [ "$ch_status" = "exited" ] || [ "$ch_status" = "dead" ]; then break; fi
              sleep 5
            done
            docker inspect --format='status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aitos-clickhouse || true
            docker logs --timestamps --tail=1000 aitos-clickhouse 2>&1 || true
            if [ "$ch_health" != "healthy" ]; then
              echo "::error::ClickHouse did not become healthy within 180 seconds."
              exit 1
            fi

            docker compose up -d redis neo4j
            docker compose up -d aitos-paper aitos-learning aitos-storage-maintenance
            docker compose ps --all

            final_bad=$(docker ps --filter 'name=aitos-' --filter 'status=restarting' -q)
            if [ -n "$final_bad" ]; then
              echo "::error::An AITOS container is still restarting after deployment."
              docker compose logs --no-color --tail=200
              exit 1
            fi

            echo "=== AITOS-PAPER READINESS GATE ==="
            paper_health=""
            paper_status="missing"
            paper_deadline=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$paper_deadline" ]; do
              paper_status=$(docker inspect --format='{{.State.Status}}' aitos-paper 2>/dev/null || echo missing)
              paper_health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aitos-paper 2>/dev/null || echo missing)
              echo "aitos-paper: status=$paper_status health=$paper_health"
              if [ "$paper_health" = "healthy" ]; then break; fi
              if [ "$paper_status" = "exited" ] || [ "$paper_status" = "dead" ]; then break; fi
              sleep 10
            done
            docker inspect --format='status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aitos-paper || true
            if [ "$paper_health" != "healthy" ]; then
              echo "::error::aitos-paper did not reach healthy state within 180 seconds."
              docker logs --timestamps --tail=500 aitos-paper || true
              exit 1
            fi

            echo "=== FINAL STORAGE AUDIT ==="
            docker system df
            echo "Boot disk: $(df -h "$HOME" | tail -1)"
            echo "Application Others: $(du -sh ./.storage/others | cut -f1)"
            echo "Database disk: $(df -h "$DATA_ROOT" | tail -1)"
            echo "ClickHouse data: $(du -sh "$DATA_ROOT/clickhouse" | cut -f1)"
            echo "Neo4j data: $(du -sh "$DATA_ROOT/neo4j" | cut -f1)"
            echo "Redis data: $(du -sh "$DATA_ROOT/redis" | cut -f1)"
            echo "=== Deployment completed successfully ==="
