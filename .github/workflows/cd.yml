name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  AITOS_DATA_ROOT: /mnt/aitos-data

jobs:
  publish-image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish-image
    environment: papertrade
    steps:
      - name: Check required deployment secrets
        id: check-secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY REDIS_PASSWORD CLICKHOUSE_PASSWORD NEO4J_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"
      - name: Write SSH key with proper formatting
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
      - name: Check system resources
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /
      - name: Deploy pre-built image to remote host over SSH
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/deploy_key
          command_timeout: 15m
          script: |
            set -euo pipefail
            mkdir -p ~/aitos
            cd ~/aitos
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            DATA_ROOT="${{ env.AITOS_DATA_ROOT }}"
            if ! mountpoint -q "$DATA_ROOT"; then
              echo "::error::$DATA_ROOT is not a mounted 150 GB data disk; refusing to place database data on the boot disk."
              exit 1
            fi
            mkdir -p "$DATA_ROOT/clickhouse" "$DATA_ROOT/neo4j" "$DATA_ROOT/redis"
            mkdir -p ./.storage/backtest ./.storage/others ./.storage/others/backups ./.storage/others/snapshots

            boot_free_bytes=$(df --output=avail -B1 . | tail -1 | tr -d ' ')
            min_free_bytes=$((5 * 1024 * 1024 * 1024))
            if [ "$boot_free_bytes" -lt "$min_free_bytes" ]; then
              echo "::error::Boot disk has less than the required 5 GiB free buffer."
              df -h .
              exit 1
            fi

            umask 077
            cat > .env << 'ENVEOF'
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            REQUIRE_HUMAN_APPROVAL_FOR_PROD=true
            DEBUG=false
            TESTING=false
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DATA_DIR=${{ env.AITOS_DATA_ROOT }}/redis
            CLICKHOUSE_HOST=clickhouse
            CLICKHOUSE_PORT=8123
            CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER || 'default' }}
            CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            CLICKHOUSE_DATABASE=aitos
            CLICKHOUSE_DB=aitos
            CLICKHOUSE_DATA_DIR=${{ env.AITOS_DATA_ROOT }}/clickhouse
            NEO4J_URI=bolt://neo4j:7687
            NEO4J_USER=${{ secrets.NEO4J_USER || 'neo4j' }}
            NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            NEO4J_DATA_DIR=${{ env.AITOS_DATA_ROOT }}/neo4j
            NEO4J_LOG_DIR=./.storage/others/neo4j-logs
            LEARNING_POLL_SECONDS=60
            LEARNING_LOOKBACK_HOURS=168
            LEARNING_MODEL_PATH=/models/online_rl/deep_value.pkl
            LEARNING_STATE_PATH=/models/online_rl/worker_state.json
            BACKTEST_DATA_DIR=./.storage/backtest
            OTHERS_DATA_DIR=./.storage/others
            BACKUP_DIR=./.storage/others/backups
            SNAPSHOT_DIR=./.storage/others/snapshots
            BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
            BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }}
            BINANCE_TESTNET=${{ secrets.BINANCE_TESTNET || 'true' }}
            BINANCE_RECV_WINDOW_MS=5000
            BINANCE_HEDGE_MODE=false
            DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER=${{ secrets.DEPLOY_USER }}
            DEPLOY_PORT=${{ secrets.DEPLOY_PORT || '22' }}
            APP_PORT=8000
            APP_HOST=0.0.0.0
            COMPOSE_PROJECT_NAME=aitos
            AITOS_IMAGE=ghcr.io/fahadhossain0909/aitos
            AITOS_IMAGE_TAG=sha-${{ github.sha }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            ENVEOF
            chmod 600 .env

            if [ "${{ secrets.BINANCE_TESTNET || 'true' }}" = "false" ]; then
              if [ -z "${{ secrets.BINANCE_API_KEY }}" ] || [ -z "${{ secrets.BINANCE_API_SECRET }}" ]; then
                echo "::error::BINANCE_API_KEY and BINANCE_API_SECRET are required when BINANCE_TESTNET=false"
                exit 1
              fi
            fi

            echo "=== Docker runtime preflight ==="
            docker info --format 'Server={{.ServerVersion}} StorageDriver={{.Driver}} OSType={{.OSType}}'
            echo "=== Data disk ==="
            df -h "$DATA_ROOT"
            echo "=== Docker disk usage ==="
            docker system df
            echo "=== Existing AITOS containers ==="
            docker ps -a --filter 'name=aitos-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            echo "=== Compose-managed AITOS containers ==="
            docker ps -a --filter 'label=com.docker.compose.project=aitos' --format 'table {{.Names}}\t{{.Status}}\t{{.Label "com.docker.compose.service"}}' || true

            echo "Logging in to GHCR..."
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin
            echo "Validating docker-compose configuration..."
            docker compose config > /dev/null
            echo "Pulling immutable application image sha-${{ github.sha }}..."
            docker compose pull

            echo "=== Removing stale/orphan Compose containers safely ==="
            docker compose down --remove-orphans --timeout 30 || true
            project_containers=$(docker ps -aq --filter 'label=com.docker.compose.project=aitos')
            if [ -n "$project_containers" ]; then
              echo "$project_containers" | xargs -r docker rm -f
            fi

            echo "=== Post-cleanup container state ==="
            docker ps -a --filter 'name=aitos-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            stale_generated=$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{8,}_aitos-' || true)
            if [ -n "$stale_generated" ]; then
              echo "::error::A stale generated AITOS container name remains after project cleanup. Refusing deployment."
              printf '%s\n' "$stale_generated"
              exit 1
            fi

            echo "=== Pre-start container state ==="
            docker compose ps --all
            echo "=== Starting pre-built application without VPS-side Docker build ==="
            echo "Docker startup timeout: 4 minutes"
            set +e
            timeout --foreground --signal=TERM --kill-after=30s 4m docker compose up -d
            compose_rc=$?
            set -e

            if [ "$compose_rc" -ne 0 ]; then
              if [ "$compose_rc" -eq 124 ] || [ "$compose_rc" -eq 137 ]; then
                echo "::error::docker compose up -d exceeded the 4-minute startup budget. Deployment is stopping here instead of consuming the full SSH timeout."
              else
                echo "::error::docker compose up -d failed with exit code $compose_rc."
              fi
              echo "=== Container state at startup failure ==="
              docker compose ps --all || true
              docker ps -a --filter 'name=aitos-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
              echo "=== Detailed container states ==="
              for c in aitos-redis aitos-clickhouse aitos-neo4j aitos-paper aitos-learning aitos-storage-maintenance; do
                if docker inspect "$c" >/dev/null 2>&1; then
                  echo "--- $c ---"
                  docker inspect --format 'status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" || true
                fi
              done
              echo "=== Recent container logs ==="
              docker compose logs --no-color --tail=150 clickhouse redis neo4j paper learning storage-maintenance 2>/dev/null || true
              echo "=== ClickHouse runtime diagnostics ==="
              if docker inspect aitos-clickhouse >/dev/null 2>&1; then
                echo "--- Healthcheck state ---"
                docker inspect --format='{{json .State.Health}}' aitos-clickhouse || true
                echo "--- Listening sockets ---"
                docker exec aitos-clickhouse sh -c 'cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | head -80' || true
                echo "--- HTTP ping verbose ---"
                docker exec aitos-clickhouse sh -c 'wget -S -O- --timeout=5 http://127.0.0.1:8123/ping 2>&1' || true
                echo "--- Native client probe ---"
                docker exec aitos-clickhouse sh -c 'clickhouse-client --query "SELECT 1" 2>&1' || true
                echo "--- ClickHouse server error log ---"
                docker exec aitos-clickhouse sh -c 'tail -n 300 /var/log/clickhouse-server/clickhouse-server.err.log 2>&1' || true
                echo "--- ClickHouse server log ---"
                docker exec aitos-clickhouse sh -c 'tail -n 200 /var/log/clickhouse-server/clickhouse-server.log 2>&1' || true
                echo "--- ClickHouse process ---"
                docker exec aitos-clickhouse sh -c 'ps -ef 2>&1' || true
              fi
              echo "=== Docker events from the last 10 minutes ==="
              docker events --since 10m --until 0s --filter type=container 2>/dev/null | tail -200 || true
              echo "=== Filesystem state ==="
              df -h "$DATA_ROOT" . || true
              exit "$compose_rc"
            fi

            echo "=== Container status after startup ==="
            docker compose ps --all

            echo "Waiting for ClickHouse to become healthy..."
            status=""
            for i in $(seq 1 120); do
              status=$(docker inspect --format='{{json .State.Health.Status}}' aitos-clickhouse 2>/dev/null || echo "null")
              echo "[$i/120] clickhouse status: $status"
              if [ "$status" = '"healthy"' ]; then
                echo "ClickHouse is healthy"
                break
              fi
              if [ $((i % 10)) -eq 0 ] || [ $i -eq 1 ]; then
                echo "=== ClickHouse logs (iteration $i) ==="
                docker compose logs --tail=100 aitos-clickhouse 2>/dev/null || true
              fi
              sleep 10
            done
            if [ "$status" != '"healthy"' ]; then
              echo "::error::ClickHouse failed to become healthy; printing full runtime diagnostics:"
              docker compose logs --no-color --tail=300 aitos-clickhouse || true
              echo "=== ClickHouse health state ==="
              docker inspect --format='{{json .State.Health}}' aitos-clickhouse || true
              echo "=== ClickHouse HTTP ping ==="
              docker exec aitos-clickhouse sh -c 'wget -S -O- --timeout=5 http://127.0.0.1:8123/ping 2>&1' || true
              echo "=== ClickHouse native probe ==="
              docker exec aitos-clickhouse sh -c 'clickhouse-client --query "SELECT 1" 2>&1' || true
              echo "=== ClickHouse error log ==="
              docker exec aitos-clickhouse sh -c 'tail -n 500 /var/log/clickhouse-server/clickhouse-server.err.log 2>&1' || true
              echo "=== ClickHouse server log ==="
              docker exec aitos-clickhouse sh -c 'tail -n 300 /var/log/clickhouse-server/clickhouse-server.log 2>&1' || true
              echo "=== ClickHouse process ==="
              docker exec aitos-clickhouse sh -c 'ps -ef 2>&1' || true
              exit 1
            fi
