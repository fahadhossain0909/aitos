name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  AITOS_DATA_ROOT: /mnt/aitos-data
  BOOT_FREE_RESERVE_BYTES: 8053063680
  DATA_DISK_MIN_FREE_GB: 20

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}:latest
          provenance: false
          sbom: false

  deploy:
    runs-on: ubuntu-latest
    needs: publish-image
    environment: papertrade
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          AITOS_DATA_DISK_UUID: ${{ secrets.AITOS_DATA_DISK_UUID }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY REDIS_PASSWORD CLICKHOUSE_PASSWORD NEO4J_PASSWORD AITOS_DATA_DISK_UUID; do
            test -n "${!name:-}" || { echo "::error::Missing secret: $name"; exit 1; }
          done
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
      - name: Deploy canonical AITOS stack
        uses: appleboy/ssh-action@v1.2.5
        env:
          AITOS_DATA_ROOT: ${{ env.AITOS_DATA_ROOT }}
          BOOT_FREE_RESERVE_BYTES: ${{ env.BOOT_FREE_RESERVE_BYTES }}
          DATA_DISK_MIN_FREE_GB: ${{ env.DATA_DISK_MIN_FREE_GB }}
          AITOS_DATA_DISK_UUID: ${{ secrets.AITOS_DATA_DISK_UUID }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || 'default' }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET || 'true' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/deploy_key
          command_timeout: 15m
          envs: AITOS_DATA_ROOT,BOOT_FREE_RESERVE_BYTES,DATA_DISK_MIN_FREE_GB,AITOS_DATA_DISK_UUID,REDIS_PASSWORD,CLICKHOUSE_USER,CLICKHOUSE_PASSWORD,NEO4J_USER,NEO4J_PASSWORD,BINANCE_API_KEY,BINANCE_API_SECRET,BINANCE_TESTNET,DATABASE_URL,SENTRY_DSN,SLACK_WEBHOOK_URL
          script: |
            set -Eeuo pipefail
            : "${AITOS_DATA_ROOT:=/mnt/aitos-data}"
            : "${BOOT_FREE_RESERVE_BYTES:=8053063680}"
            : "${DATA_DISK_MIN_FREE_GB:=20}"
            : "${AITOS_DATA_DISK_UUID:?missing data disk UUID}"
            APP_DIR="$HOME/aitos"
            REPO="${{ github.repository }}"
            COMMIT="${{ github.sha }}"
            mkdir -p "$APP_DIR"
            exec 9>"$HOME/.aitos-deploy.lock"
            flock 9

            echo '=== BOOT DISK PREFLIGHT ==='
            boot_free=$(df -B1 --output=avail "$HOME" | tail -1 | tr -d ' ')
            [ "$boot_free" -ge "$BOOT_FREE_RESERVE_BYTES" ] || {
              echo '::error::Boot disk below reserve; refusing destructive cleanup during deployment.'
              echo 'Run the explicit HARD RESET workflow or clean unrelated host state manually.'
              exit 1
            }

            echo '=== SOURCE DEPLOYMENT ==='
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -fsSL --retry 3 --retry-delay 2 "https://github.com/$REPO/archive/$COMMIT.tar.gz" -o "$tmp_dir/source.tar.gz"
            mkdir -p "$tmp_dir/source"
            tar -xzf "$tmp_dir/source.tar.gz" --strip-components=1 -C "$tmp_dir/source"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "$tmp_dir/source/." "$APP_DIR/"
            cd "$APP_DIR"

            echo '=== CANONICAL STORAGE BOOTSTRAP ==='
            export AITOS_DATA_ROOT AITOS_DATA_DISK_UUID
            export AITOS_HOST_UID="$(id -u)" AITOS_HOST_GID="$(id -g)"
            chmod +x scripts/bootstrap_storage.sh
            ./scripts/bootstrap_storage.sh
            mountpoint -q "$AITOS_DATA_ROOT"

            echo '=== CANONICAL PRODUCTION ENV ==='
            umask 077
            cat > .env << ENVEOF
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            REQUIRE_HUMAN_APPROVAL_FOR_PROD=true
            DEBUG=false
            TESTING=false
            AITOS_DATA_ROOT=$AITOS_DATA_ROOT
            AITOS_DATA_DISK_UUID=$AITOS_DATA_DISK_UUID
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            REDIS_PASSWORD=$REDIS_PASSWORD
            REDIS_DATA_DIR=$AITOS_DATA_ROOT/eventbus/redis
            CLICKHOUSE_HOST=clickhouse
            CLICKHOUSE_PORT=8123
            CLICKHOUSE_USER=$CLICKHOUSE_USER
            CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
            CLICKHOUSE_DATABASE=aitos
            CLICKHOUSE_DB=aitos
            CLICKHOUSE_DATA_DIR=$AITOS_DATA_ROOT/databases/clickhouse
            NEO4J_URI=bolt://neo4j:7687
            NEO4J_USER=$NEO4J_USER
            NEO4J_PASSWORD=$NEO4J_PASSWORD
            NEO4J_DATA_DIR=$AITOS_DATA_ROOT/databases/neo4j
            NEO4J_LOG_DIR=$AITOS_DATA_ROOT/runtime/logs/neo4j
            LEARNING_POLL_SECONDS=60
            LEARNING_LOOKBACK_HOURS=168
            LEARNING_MODEL_PATH=$AITOS_DATA_ROOT/runtime/models/online_rl/deep_value.pkl
            LEARNING_STATE_PATH=$AITOS_DATA_ROOT/runtime/models/online_rl/worker_state.json
            BACKTEST_DATA_DIR=$AITOS_DATA_ROOT/research/backtest
            REPLAY_DATA_DIR=$AITOS_DATA_ROOT/research/replay
            BACKUP_DIR=$AITOS_DATA_ROOT/artifacts/backups
            SNAPSHOT_DIR=$AITOS_DATA_ROOT/artifacts/snapshots
            MODEL_DATA_DIR=$AITOS_DATA_ROOT/runtime/models
            RUNTIME_TMP_DIR=$AITOS_DATA_ROOT/runtime/tmp
            ARTIFACTS_DATA_DIR=$AITOS_DATA_ROOT/artifacts
            AITOS_BOOT_RUNTIME_DIR=/var/lib/aitos
            BOOT_FREE_BUFFER_GB=7.5
            DATA_DISK_MIN_FREE_GB=$DATA_DISK_MIN_FREE_GB
            DATA_DISK_TARGET_FREE_GB=25
            BINANCE_API_KEY=$BINANCE_API_KEY
            BINANCE_API_SECRET=$BINANCE_API_SECRET
            BINANCE_TESTNET=$BINANCE_TESTNET
            BINANCE_RECV_WINDOW_MS=5000
            BINANCE_HEDGE_MODE=false
            DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER=${{ secrets.DEPLOY_USER }}
            DEPLOY_PORT=${{ secrets.DEPLOY_PORT || '22' }}
            APP_PORT=8000
            APP_HOST=0.0.0.0
            COMPOSE_PROJECT_NAME=aitos
            AITOS_IMAGE=ghcr.io/fahadhossain0909/aitos
            AITOS_IMAGE_TAG=sha-${{ github.sha }}
            DATABASE_URL=$DATABASE_URL
            SENTRY_DSN=$SENTRY_DSN
            SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL
            ENVEOF
            chmod 600 .env

            echo '=== CANONICAL PATH ASSERTIONS ==='
            grep -q '^REDIS_DATA_DIR=/mnt/aitos-data/eventbus/redis$' .env
            grep -q '^CLICKHOUSE_DATA_DIR=/mnt/aitos-data/databases/clickhouse$' .env
            grep -q '^NEO4J_DATA_DIR=/mnt/aitos-data/databases/neo4j$' .env
            grep -q '^NEO4J_LOG_DIR=/mnt/aitos-data/runtime/logs/neo4j$' .env
            grep -q '^BACKTEST_DATA_DIR=/mnt/aitos-data/research/backtest$' .env
            ! grep -q 'OTHERS_DATA_DIR\|\.storage/others' .env

            echo '=== DOCKER VALIDATION ==='
            docker compose config >/dev/null
            docker compose pull
            docker compose down --remove-orphans --timeout 30 || true
            docker compose up -d --remove-orphans --force-recreate

            echo '=== HEALTH GATE ==='
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              redis_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aitos-redis 2>/dev/null || true)
              clickhouse_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aitos-clickhouse 2>/dev/null || true)
              neo4j_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aitos-neo4j 2>/dev/null || true)
              if [ "$redis_state" = healthy ] && [ "$clickhouse_state" = healthy ] && [ "$neo4j_state" = healthy ]; then break; fi
              sleep 10
            done
            [ "$(docker inspect --format '{{.State.Health.Status}}' aitos-redis)" = healthy ]
            [ "$(docker inspect --format '{{.State.Health.Status}}' aitos-clickhouse)" = healthy ]
            [ "$(docker inspect --format '{{.State.Health.Status}}' aitos-neo4j)" = healthy ]
            ! docker compose ps --all --format '{{.Name}} {{.State}}' | grep -E 'unhealthy|Restarting|Exited'

            echo '=== STORAGE GATE ==='
            df -h "$AITOS_DATA_ROOT"
            test -d "$AITOS_DATA_ROOT/databases/clickhouse"
            test -d "$AITOS_DATA_ROOT/databases/neo4j"
            test -d "$AITOS_DATA_ROOT/eventbus/redis/live"
            test -d "$AITOS_DATA_ROOT/eventbus/redis/archive"
            test -d "$AITOS_DATA_ROOT/research/backtest"
            test -d "$AITOS_DATA_ROOT/research/replay"
            test -d "$AITOS_DATA_ROOT/artifacts/backups"
            test -d "$AITOS_DATA_ROOT/artifacts/snapshots"
            test -d "$AITOS_DATA_ROOT/runtime/models"
            test -d "$AITOS_DATA_ROOT/runtime/logs/neo4j"
            test -d "$AITOS_DATA_ROOT/runtime/tmp"

            echo "=== DEPLOYMENT SUCCESS: $COMMIT ==="
            docker system df
      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/deploy_key
