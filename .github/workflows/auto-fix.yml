name: CI Auto-Fix

on:
  # PRs from same-repository branches are handled by pull_request_target below.
  # Restrict push-triggered autofix to main to avoid one run per feature-branch commit.
  push:
    branches: [main]
  pull_request_target:
    branches: [main, master, develop]

permissions:
  contents: write

# Serialize auto-fix runs per source branch. Architecture V1 is intentionally
# excluded: its commits are validated by the dedicated contract workflow and
# must not be rewritten underneath implementation commits.
concurrency:
  group: auto-fix-${{ github.repository }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-autofix:
    name: Safe Python Auto-Fix
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref_name != 'architecture/market-data-v1') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != 'architecture/market-data-v1')
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install safe auto-fix tools
        run: |
          python -m pip install --upgrade pip
          pip install black==25.12.0 isort ruff

      - name: Determine formatting scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.head_commit.message }}" == *"[format-all]"* ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=changed" >> "$GITHUB_OUTPUT"

      - name: Run Black (full repository)
        if: steps.scope.outputs.mode == 'all'
        run: black .
      - name: Run isort (full repository)
        if: steps.scope.outputs.mode == 'all'
        run: isort .
      - name: Run Ruff safe fixes (full repository)
        if: steps.scope.outputs.mode == 'all'
        # Keep fixes compatible with the lowest supported runtime (Python 3.10).
        run: ruff check --target-version py310 --ignore UP017 --fix --exit-zero .

      - name: Run safe fixes (changed Python files)
        if: steps.scope.outputs.mode == 'changed'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-list --max-count=1 HEAD^)"
            fi
          fi

          # Only pass files that are present in the checked-out tree.
          # Deleted Python paths must never be handed to Black/isort/Ruff.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.py')

          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            black "$file"
            isort "$file"
            # UP017 would rewrite timezone.utc to datetime.UTC (Python 3.11+ only).
            ruff check --target-version py310 --ignore UP017 --fix --exit-zero "$file"
          done

      - name: Commit and push safe fixes
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No automatic fixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "ci: apply automatic formatting and safe lint fixes"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$SOURCE_BRANCH"
            if git rebase "origin/$SOURCE_BRANCH"; then
              if git push origin "HEAD:refs/heads/$SOURCE_BRANCH"; then
                echo "Automatic fixes pushed to $SOURCE_BRANCH."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt raced with another update; retrying."
            sleep $((attempt * 2))
          done
          echo "Unable to push automatic fixes after multiple concurrent-update retries." >&2
          exit 1
