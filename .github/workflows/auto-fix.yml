name: CI Formatting & Lint Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and safe lint checks (no writes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black==25.12.0 isort ruff
      - name: Verify Black formatting
        run: black --check --diff .
      - name: Verify import ordering
        run: isort --check-only --diff .
      - name: Verify Ruff rules (Python 3.10 compatible)
        run: ruff check --target-version py310 --ignore UP017 .
