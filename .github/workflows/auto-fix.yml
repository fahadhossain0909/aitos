name: CI Auto-Fix

on:
  push:
    branches: ["**"]
  pull_request_target:
    branches: [main, master, develop]

permissions:
  contents: write

# Serialize auto-fix runs per source branch. Do not cancel an active fixer;
# queue the next run so concurrent commits are rebased in order.
concurrency:
  group: auto-fix-${{ github.repository }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  python-autofix:
    name: Safe Python Auto-Fix
    runs-on: ubuntu-latest
    # Never execute or modify code from an untrusted fork. Fork PRs continue
    # through normal read-only CI checks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install safe auto-fix tools
        run: |
          python -m pip install --upgrade pip
          pip install black==25.12.0 isort ruff

      - name: Determine changed Python files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-list --max-count=1 HEAD^)"
            fi
          fi
          files="$(git diff --name-only "$base" "$head" -- '*.py' | tr '\n' ' ' | xargs || true)"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run Black
        if: steps.changed.outputs.files != ''
        run: black ${{ steps.changed.outputs.files }}

      - name: Run isort
        if: steps.changed.outputs.files != ''
        run: isort ${{ steps.changed.outputs.files }}

      - name: Run Ruff safe fixes
        if: steps.changed.outputs.files != ''
        run: ruff check --fix --exit-zero ${{ steps.changed.outputs.files }}

      - name: Commit and push safe fixes
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No automatic fixes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "ci: apply automatic formatting and safe lint fixes"

          # Never push a PR merge ref. SOURCE_BRANCH is always the actual
          # writable branch for trusted same-repository PRs or push events.
          # Rebase onto the latest remote tip before every push attempt so
          # concurrent human/bot commits are preserved instead of overwritten.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$SOURCE_BRANCH"

            if git rebase "origin/$SOURCE_BRANCH"; then
              if git push origin "HEAD:refs/heads/$SOURCE_BRANCH"; then
                echo "Automatic fixes pushed to $SOURCE_BRANCH."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            echo "Push attempt $attempt raced with another update; retrying."
            sleep $((attempt * 2))
          done

          echo "Unable to push automatic fixes after multiple concurrent-update retries." >&2
          exit 1
