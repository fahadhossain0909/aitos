name: Historical ClickHouse Export

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to export, e.g. BTCUSDT"
        required: true
        default: "BTCUSDT"
        type: string
      hours:
        description: "Historical window in hours"
        required: true
        default: "24"
        type: string
      include_orderbook:
        description: "Include L2 order-book snapshots"
        required: true
        default: true
        type: boolean
      include_trades:
        description: "Include trade ticks"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  EXPORT_ROOT: /tmp/aitos-history-export

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        shell: bash
        env:
          SYMBOL: ${{ inputs.symbol }}
          HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          [[ "$SYMBOL" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$HOURS" =~ ^[1-9][0-9]{0,3}$ ]]
          (( HOURS <= 720 ))

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/aitos_history_key"
          chmod 600 "$RUNNER_TEMP/aitos_history_key"

      - name: Export bounded ClickHouse history from VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ runner.temp }}/aitos_history_key
          SYMBOL: ${{ inputs.symbol }}
          HOURS: ${{ inputs.hours }}
          INCLUDE_ORDERBOOK: ${{ inputs.include_orderbook }}
          INCLUDE_TRADES: ${{ inputs.include_trades }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          mkdir -p "$EXPORT_ROOT"

          ssh_cmd=(ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}")

          "${ssh_cmd[@]}" "SYMBOL='$SYMBOL' HOURS='$HOURS' INCLUDE_ORDERBOOK='$INCLUDE_ORDERBOOK' INCLUDE_TRADES='$INCLUDE_TRADES' bash -s" > "$EXPORT_ROOT/history.tar.gz" <<'REMOTE'
          set -euo pipefail
          : "${SYMBOL:?}" "${HOURS:?}"
          case "$SYMBOL" in (*[!A-Za-z0-9._-]*) exit 2;; esac
          case "$HOURS" in (*[!0-9]*) exit 2;; esac
          (( HOURS >= 1 && HOURS <= 720 ))

          WORK="$HOME/.aitos-history-export"
          rm -rf "$WORK"
          mkdir -p "$WORK/data"
          START="$(date -u -d "-${HOURS} hours" '+%Y-%m-%d %H:%M:%S')"
          END="$(date -u '+%Y-%m-%d %H:%M:%S')"

          {
            echo '{'
            printf '  "symbol": %s,\n' "$(printf '%s' "$SYMBOL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
            printf '  "start_utc": %s,\n' "$(printf '%s' "$START" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
            printf '  "end_utc": %s,\n' "$(printf '%s' "$END" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
            printf '  "hours": %s\n' "$HOURS"
            echo '}'
          } > "$WORK/manifest.json"

          if [ "$INCLUDE_TRADES" = "true" ]; then
            docker inspect aitos-clickhouse >/dev/null
            docker exec aitos-clickhouse clickhouse-client --query \
              "SELECT time, price, quantity, side, trade_id, is_buyer_maker FROM aitos.trade_ticks WHERE symbol = '$SYMBOL' AND time >= toDateTime64('$START', 3) AND time < toDateTime64('$END', 3) ORDER BY time FORMAT JSONEachRow" \
              | gzip -1 > "$WORK/data/trade_ticks.jsonl.gz"
          fi

          if [ "$INCLUDE_ORDERBOOK" = "true" ]; then
            docker inspect aitos-clickhouse >/dev/null
            docker exec aitos-clickhouse clickhouse-client --query \
              "SELECT time, bid_levels, ask_levels, spread, depth_ratio, last_update_id FROM aitos.order_book_snapshots WHERE symbol = '$SYMBOL' AND time >= toDateTime64('$START', 3) AND time < toDateTime64('$END', 3) ORDER BY time FORMAT JSONEachRow" \
              | gzip -1 > "$WORK/data/order_book_snapshots.jsonl.gz"
          fi

          du -h "$WORK"/* "$WORK"/data/* 2>/dev/null || true
          tar -C "$WORK" -czf - manifest.json data
          rm -rf "$WORK"
          REMOTE

      - name: Extract and validate export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_ROOT/unpacked"
          tar -xzf "$EXPORT_ROOT/history.tar.gz" -C "$EXPORT_ROOT/unpacked"
          test -s "$EXPORT_ROOT/unpacked/manifest.json"
          echo "Export manifest:"
          cat "$EXPORT_ROOT/unpacked/manifest.json"
          echo "Files:"
          find "$EXPORT_ROOT/unpacked" -type f -printf '%p %s bytes\n' | sort

      - name: Upload historical dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: aitos-clickhouse-history-${{ inputs.symbol }}-${{ inputs.hours }}h-${{ github.run_id }}
          path: ${{ env.EXPORT_ROOT }}/unpacked
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$EXPORT_ROOT" "$RUNNER_TEMP/aitos_history_key"
