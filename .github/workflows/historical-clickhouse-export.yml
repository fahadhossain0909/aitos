name: Historical ClickHouse Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to replay"
        required: true
        default: "BTCUSDT"
        type: string
      hours:
        description: "Historical window in hours"
        required: true
        default: "24"
        type: string
      tick_size:
        description: "Symbol tick size"
        required: true
        default: "0.10"
        type: string
      initial_cash:
        description: "Initial backtest cash"
        required: true
        default: "10000"
        type: string
      fee_rate:
        description: "Fee rate"
        required: true
        default: "0.0004"
        type: string
      slippage_bps:
        description: "Slippage in basis points"
        required: true
        default: "1"
        type: string
      leverage:
        description: "Backtest leverage"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

env:
  WORK_ROOT: /tmp/aitos-history-backtest

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        shell: bash
        env:
          SYMBOL: ${{ inputs.symbol }}
          HOURS: ${{ inputs.hours }}
          TICK_SIZE: ${{ inputs.tick_size }}
          INITIAL_CASH: ${{ inputs.initial_cash }}
          FEE_RATE: ${{ inputs.fee_rate }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
          LEVERAGE: ${{ inputs.leverage }}
        run: |
          set -euo pipefail
          [[ "$SYMBOL" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$HOURS" =~ ^[1-9][0-9]{0,3}$ ]] && (( HOURS <= 720 ))
          python3 - <<'PY'
          import os
          for key in ('TICK_SIZE','INITIAL_CASH','FEE_RATE','SLIPPAGE_BPS','LEVERAGE'):
              value=float(os.environ[key])
              if value < 0: raise SystemExit(f'{key} must be >= 0')
          if float(os.environ['TICK_SIZE']) == 0 or float(os.environ['INITIAL_CASH']) <= 0:
              raise SystemExit('tick size and initial cash must be positive')
          if float(os.environ['LEVERAGE']) < 1:
              raise SystemExit('leverage must be >= 1')
          PY

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/aitos_history_key"

      - name: Run paired historical backtest on VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ runner.temp }}/aitos_history_key
          SYMBOL: ${{ inputs.symbol }}
          HOURS: ${{ inputs.hours }}
          TICK_SIZE: ${{ inputs.tick_size }}
          INITIAL_CASH: ${{ inputs.initial_cash }}
          FEE_RATE: ${{ inputs.fee_rate }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
          LEVERAGE: ${{ inputs.leverage }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"; test -n "$DEPLOY_USER"
          mkdir -p "$WORK_ROOT"
          ssh_cmd=(ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}")

          "${ssh_cmd[@]}" "SYMBOL='$SYMBOL' HOURS='$HOURS' TICK_SIZE='$TICK_SIZE' INITIAL_CASH='$INITIAL_CASH' FEE_RATE='$FEE_RATE' SLIPPAGE_BPS='$SLIPPAGE_BPS' LEVERAGE='$LEVERAGE' bash -s" > "$WORK_ROOT/result.json" <<'REMOTE'
          set -euo pipefail
          : "${SYMBOL:?}" "${HOURS:?}"
          case "$SYMBOL" in (*[!A-Za-z0-9._-]*) exit 2;; esac
          case "$HOURS" in (*[!0-9]*) exit 2;; esac
          (( HOURS >= 1 && HOURS <= 720 ))
          WORK="$HOME/.aitos-history-backtest"
          rm -rf "$WORK"; mkdir -p "$WORK"
          START="$(date -u -d "-${HOURS} hours" '+%Y-%m-%dT%H:%M:%SZ')"
          END="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          docker compose --profile backtest run --rm --no-deps \
            -e AITOS_BACKTEST_START="$START" -e AITOS_BACKTEST_END="$END" \
            aitos-backtest python3 - <<'PY' > "$WORK/baseline.json"
          import json, os
          from aitos.backtest.aitos_runner import AITOSHistoricalRunner
          from aitos.backtest.clickhouse_source import ClickHouseHistoricalSource
          # The canonical decision adapter is supplied by the image/configured strategy layer.
          # This probe deliberately fails closed until a decision strategy is configured.
          raise SystemExit("Historical paired backtest requires configured canonical decision strategy")
          PY
          REMOTE

      - name: Fail closed if canonical strategy is not configured
        if: failure()
        run: |
          echo "No real paired benchmark was produced. The workflow refuses to fabricate baseline/hedged results."
          exit 1

      - name: Validate result JSON
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('/tmp/aitos-history-backtest/result.json') as f:
              json.load(f)
          PY

      - name: Upload paired benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: aitos-hedge-backtest-${{ inputs.symbol }}-${{ inputs.hours }}h-${{ github.run_id }}
          path: ${{ env.WORK_ROOT }}
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf "$WORK_ROOT" "$RUNNER_TEMP/aitos_history_key"
