# trigger finalization
name: Finalize direct live workers

on:
  push:
    paths:
      - .github/workflows/finalize-direct-live-workers.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase persistence worker parallelism
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aitos/data/ingestion.py')
          s=p.read_text()
          old='            asyncio.create_task(self._run_trade_persistence(), name="aitos-trade-persistence"),\n'
          new='            *[asyncio.create_task(self._run_trade_persistence(), name=f"aitos-trade-persistence-{i}") for i in range(TRADE_SINK_CONCURRENCY)],\n'
          if old not in s:
              raise SystemExit('persistence task pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate syntax
        run: python -m compileall -q aitos
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/data/ingestion.py
          git commit -m "perf: parallelize live trade persistence workers"
          git push
