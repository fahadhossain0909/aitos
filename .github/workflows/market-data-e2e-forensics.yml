name: Market Data E2E Forensics

on:
  workflow_dispatch:
    inputs:
      window_seconds:
        description: Observation window in seconds
        required: false
        default: '120'
      interval_seconds:
        description: Sampling interval in seconds
        required: false
        default: '10'

permissions:
  contents: read

jobs:
  e2e-forensics:
    name: VPS market-data chain-of-custody
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_e2e_key
          chmod 600 /tmp/aitos_e2e_key

      - name: Run E2E forensic observation on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          FORENSIC_WINDOW: ${{ inputs.window_seconds || '120' }}
          FORENSIC_INTERVAL: ${{ inputs.interval_seconds || '10' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/aitos_e2e_key
          command_timeout: 12m
          envs: FORENSIC_WINDOW,FORENSIC_INTERVAL
          script: |
            set -euo pipefail
            cd "$HOME/aitos"
            test -f scripts/market_data_e2e_forensics.sh
            export AITOS_FORENSIC_WINDOW_SECONDS="$FORENSIC_WINDOW"
            export AITOS_FORENSIC_INTERVAL_SECONDS="$FORENSIC_INTERVAL"
            export AITOS_FORENSIC_REPORT_DIR="$HOME/aitos-market-data-e2e-forensics"
            rm -rf "$AITOS_FORENSIC_REPORT_DIR"
            bash scripts/market_data_e2e_forensics.sh

      - name: Retrieve forensic bundle
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p aitos-market-data-e2e-forensics
          scp -i /tmp/aitos_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-market-data-e2e-forensics/report.md" \
            aitos-market-data-e2e-forensics/report.md
          scp -i /tmp/aitos_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-market-data-e2e-forensics/report.json" \
            aitos-market-data-e2e-forensics/report.json
          scp -i /tmp/aitos_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-market-data-e2e-forensics/samples.jsonl" \
            aitos-market-data-e2e-forensics/samples.jsonl

      - name: Publish forensic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s aitos-market-data-e2e-forensics/report.md
          cat aitos-market-data-e2e-forensics/report.md

      - name: Upload forensic artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aitos-market-data-e2e-forensics
          path: aitos-market-data-e2e-forensics/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: rm -f /tmp/aitos_e2e_key
