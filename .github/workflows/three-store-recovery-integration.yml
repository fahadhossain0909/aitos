name: Three-Store Execution Recovery Integration

on:
  push:
    branches:
      - "audit/system-audit-and-docs-2026-11"
  pull_request:
    paths:
      - "aitos/execution/**"
      - "aitos/strategy/**"
      - "aitos/intelligence/capital_protection.py"
      - "aitos/trading/lifecycle.py"
      - "aitos/trading/reconciliation.py"
      - "aitos/trading/persistent_state.py"
      - "tests/integration/test_execution_recovery_three_store.py"
      - "tests/test_protection_child_*.py"
      - "tests/test_strategy_opportunity_bridge.py"
      - "tests/test_reconciliation_scheduler.py"
      - ".github/workflows/three-store-recovery-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clickhouse-sqlite-venue-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: aitos-integration-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and integration dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-timeout clickhouse-connect aiohttp
      - name: Run real ClickHouse + SQLite + Binance adapter crash matrix
        env:
          PYTHONPATH: .
          AITOS_ENABLE_THREE_STORE_FAULT_TESTS: "1"
          AITOS_FAULT_CLICKHOUSE_HOST: 127.0.0.1
          AITOS_FAULT_CLICKHOUSE_PORT: "8123"
          AITOS_FAULT_CLICKHOUSE_USER: default
          AITOS_FAULT_CLICKHOUSE_PASSWORD: aitos-integration-password
        run: |
          pytest -q --timeout=120 tests/integration/test_execution_recovery_three_store.py
      - name: Run restart and ambiguity regression matrix
        env:
          PYTHONPATH: .
        run: |
          pytest -q --timeout=120 \
            tests/test_protection_child_lifecycle.py \
            tests/test_protection_child_reconciliation.py \
            tests/test_strategy_opportunity_bridge.py \
            tests/test_reconciliation_scheduler.py

  binance-demo-testnet-read-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Require dedicated demo-testnet credentials
        env:
          BINANCE_FUTURES_TESTNET_API_KEY: ${{ secrets.BINANCE_FUTURES_TESTNET_API_KEY }}
          BINANCE_FUTURES_TESTNET_API_SECRET: ${{ secrets.BINANCE_FUTURES_TESTNET_API_SECRET }}
        run: |
          if [ -z "$BINANCE_FUTURES_TESTNET_API_KEY" ]; then
            echo "Missing BINANCE_FUTURES_TESTNET_API_KEY secret"
            exit 1
          fi
          if [ -z "$BINANCE_FUTURES_TESTNET_API_SECRET" ]; then
            echo "Missing BINANCE_FUTURES_TESTNET_API_SECRET secret"
            exit 1
          fi
      - name: Verify authenticated demo-testnet inventory (read-only)
        env:
          PYTHONPATH: .
          AITOS_ENABLE_BINANCE_TESTNET_READONLY: "1"
          BINANCE_FUTURES_TESTNET_API_KEY: ${{ secrets.BINANCE_FUTURES_TESTNET_API_KEY }}
          BINANCE_FUTURES_TESTNET_API_SECRET: ${{ secrets.BINANCE_FUTURES_TESTNET_API_SECRET }}
        run: |
          pytest -q tests/integration/test_execution_recovery_three_store.py -k authenticated_binance_demo_testnet_read_only_preflight
