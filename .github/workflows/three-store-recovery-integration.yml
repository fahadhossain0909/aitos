name: Three-Store Execution Recovery Integration

on:
  push:
    branches:
      - "audit/system-audit-and-docs-2026-11"
  pull_request:
    paths:
      - "aitos/execution/**"
      - "aitos/strategy/**"
      - "aitos/intelligence/capital_protection.py"
      - "aitos/trading/lifecycle.py"
      - "aitos/trading/reconciliation.py"
      - "aitos/trading/persistent_state.py"
      - "tests/integration/test_execution_recovery_three_store.py"
      - "tests/test_protection_child_*.py"
      - "tests/test_strategy_opportunity_bridge.py"
      - "tests/test_reconciliation_scheduler.py"
      - "scripts/render_postgres_smoke.py"
      - "aitos/storage/postgres_migrations.py"
      - "aitos/data/postgres_repository.py"
      - "aitos/journal/postgres_repository.py"
      - "tests/test_render_postgres_smoke.py"
      - "tests/storage/test_postgres_migrations.py"
      - ".github/workflows/three-store-recovery-integration.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  clickhouse-sqlite-venue-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: aitos-integration-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password aitos-integration-password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and integration dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-timeout clickhouse-connect aiohttp
      - name: Check formatting and critical Python lint on recovery/strategy files
        run: |
          pip install black==25.12.0 flake8
          black \
            aitos/execution/intent_store.py \
            aitos/execution/protection_reconciliation.py \
            aitos/execution/protection_child_reconciliation.py \
            aitos/execution/order_executor.py \
            aitos/execution/attributed_executor.py \
            aitos/execution/binance_executor.py \
            aitos/trading/lifecycle.py \
            aitos/strategy/opportunity_bridge.py \
            aitos/strategy/shadow_bridge.py \
            run_live_trading.py \
            aitos/trading/reconciliation.py \
            tests/test_execution_intent_recovery.py \
            tests/test_protection_reconciliation.py \
            tests/test_protection_child_reconciliation.py \
            tests/test_protection_child_lifecycle.py \
            tests/test_exchange_side_stops.py \
            tests/test_reconciliation_scheduler.py \
            tests/test_strategy_opportunity_bridge.py \
            tests/integration/test_execution_recovery_three_store.py
          black --check --diff \
            scripts/render_postgres_smoke.py \
            tests/test_render_postgres_smoke.py \
            aitos/storage/postgres_migrations.py \
            aitos/data/postgres_repository.py \
            aitos/journal/postgres_repository.py \
            tests/storage/test_postgres_migrations.py
          black --check --diff \
            aitos/execution/intent_store.py \
            aitos/execution/protection_reconciliation.py \
            aitos/execution/protection_child_reconciliation.py \
            aitos/execution/order_executor.py \
            aitos/execution/attributed_executor.py \
            aitos/execution/binance_executor.py \
            aitos/trading/lifecycle.py \
            aitos/strategy/opportunity_bridge.py \
            aitos/strategy/shadow_bridge.py \
            run_live_trading.py \
            aitos/trading/reconciliation.py \
            tests/test_execution_intent_recovery.py \
            tests/test_protection_reconciliation.py \
            tests/test_protection_child_reconciliation.py \
            tests/test_protection_child_lifecycle.py \
            tests/test_exchange_side_stops.py \
            tests/test_reconciliation_scheduler.py \
            tests/test_strategy_opportunity_bridge.py \
            tests/integration/test_execution_recovery_three_store.py
          flake8 \
            scripts/render_postgres_smoke.py \
            tests/test_render_postgres_smoke.py \
            aitos/storage/postgres_migrations.py \
            aitos/data/postgres_repository.py \
            aitos/journal/postgres_repository.py \
            tests/storage/test_postgres_migrations.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 \
            aitos/execution/intent_store.py \
            aitos/execution/protection_reconciliation.py \
            aitos/execution/protection_child_reconciliation.py \
            aitos/execution/order_executor.py \
            aitos/execution/attributed_executor.py \
            aitos/execution/binance_executor.py \
            aitos/trading/lifecycle.py \
            aitos/strategy/opportunity_bridge.py \
            aitos/strategy/shadow_bridge.py \
            run_live_trading.py \
            aitos/trading/reconciliation.py \
            tests/test_execution_intent_recovery.py \
            tests/test_protection_reconciliation.py \
            tests/test_protection_child_reconciliation.py \
            tests/test_protection_child_lifecycle.py \
            tests/test_exchange_side_stops.py \
            tests/test_reconciliation_scheduler.py \
            tests/test_strategy_opportunity_bridge.py \
            tests/integration/test_execution_recovery_three_store.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Upload Black-formatted recovery and strategy sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitos-recovery-formatted-${{ github.sha }}
          if-no-files-found: error
          path: |
            aitos/execution/intent_store.py
            aitos/execution/protection_reconciliation.py
            aitos/execution/protection_child_reconciliation.py
            aitos/execution/order_executor.py
            aitos/execution/attributed_executor.py
            aitos/execution/binance_executor.py
            aitos/trading/lifecycle.py
            aitos/strategy/opportunity_bridge.py
            aitos/strategy/shadow_bridge.py
            run_live_trading.py
            aitos/trading/reconciliation.py
            tests/test_execution_intent_recovery.py
            tests/test_protection_reconciliation.py
            tests/test_protection_child_reconciliation.py
            tests/test_protection_child_lifecycle.py
            tests/test_exchange_side_stops.py
            tests/test_reconciliation_scheduler.py
            tests/test_strategy_opportunity_bridge.py
            tests/integration/test_execution_recovery_three_store.py
      - name: Run real ClickHouse + SQLite + Binance adapter crash matrix
        env:
          PYTHONPATH: .
          AITOS_ENABLE_THREE_STORE_FAULT_TESTS: "1"
          AITOS_FAULT_CLICKHOUSE_HOST: 127.0.0.1
          AITOS_FAULT_CLICKHOUSE_PORT: "8123"
          AITOS_FAULT_CLICKHOUSE_USER: default
          AITOS_FAULT_CLICKHOUSE_PASSWORD: aitos-integration-password
        run: |
          pytest -q --timeout=120 tests/integration/test_execution_recovery_three_store.py
      - name: Run restart and ambiguity regression matrix
        env:
          PYTHONPATH: .
        run: |
          pytest -q --timeout=120 \
            tests/test_protection_child_lifecycle.py \
            tests/test_protection_child_reconciliation.py \
            tests/test_protection_reconciliation.py \
            tests/test_strategy_opportunity_bridge.py \
            tests/test_reconciliation_scheduler.py \
            tests/test_render_postgres_smoke.py \
            tests/storage/test_postgres_migrations.py
      - name: Commit formatter output on the dedicated audit branch
        id: commit_format
        if: github.event_name == 'push' && github.ref_name == 'audit/system-audit-and-docs-2026-11'
        run: |
          git add -- \
            aitos/execution/intent_store.py \
            aitos/execution/protection_reconciliation.py \
            aitos/execution/protection_child_reconciliation.py \
            aitos/execution/order_executor.py \
            aitos/execution/attributed_executor.py \
            aitos/execution/binance_executor.py \
            aitos/trading/lifecycle.py \
            aitos/strategy/opportunity_bridge.py \
            aitos/strategy/shadow_bridge.py \
            run_live_trading.py \
            aitos/trading/reconciliation.py \
            tests/test_execution_intent_recovery.py \
            tests/test_protection_reconciliation.py \
            tests/test_protection_child_reconciliation.py \
            tests/test_protection_child_lifecycle.py \
            tests/test_exchange_side_stops.py \
            tests/test_reconciliation_scheduler.py \
            tests/test_strategy_opportunity_bridge.py \
            tests/integration/test_execution_recovery_three_store.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format execution recovery and shadow strategy bridge"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch full CI for the formatted commit
        if: steps.commit_format.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"

  binance-demo-testnet-read-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Require dedicated demo-testnet credentials
        env:
          BINANCE_FUTURES_TESTNET_API_KEY: ${{ secrets.BINANCE_FUTURES_TESTNET_API_KEY }}
          BINANCE_FUTURES_TESTNET_API_SECRET: ${{ secrets.BINANCE_FUTURES_TESTNET_API_SECRET }}
        run: |
          if [ -z "$BINANCE_FUTURES_TESTNET_API_KEY" ]; then
            echo "Missing BINANCE_FUTURES_TESTNET_API_KEY secret"
            exit 1
          fi
          if [ -z "$BINANCE_FUTURES_TESTNET_API_SECRET" ]; then
            echo "Missing BINANCE_FUTURES_TESTNET_API_SECRET secret"
            exit 1
          fi
      - name: Verify authenticated demo-testnet inventory (read-only)
        env:
          PYTHONPATH: .
          AITOS_ENABLE_BINANCE_TESTNET_READONLY: "1"
          BINANCE_FUTURES_TESTNET_API_KEY: ${{ secrets.BINANCE_FUTURES_TESTNET_API_KEY }}
          BINANCE_FUTURES_TESTNET_API_SECRET: ${{ secrets.BINANCE_FUTURES_TESTNET_API_SECRET }}
        run: |
          pytest -q tests/integration/test_execution_recovery_three_store.py -k authenticated_binance_demo_testnet_read_only_preflight
