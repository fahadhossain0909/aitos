name: PostgreSQL Storage Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  postgres-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aitos_test
          POSTGRES_PASSWORD: aitos_test_password
          POSTGRES_DB: aitos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aitos_test -d aitos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_DB: aitos_test
          CLICKHOUSE_USER: aitos_test
          CLICKHOUSE_PASSWORD: aitos_test_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user aitos_test --password aitos_test_password --query 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AITOS_TEST_POSTGRES_URL: postgresql://aitos_test:aitos_test_password@127.0.0.1:5432/aitos_test
      AITOS_RECONCILE_POSTGRES_URL: postgresql://aitos_test:aitos_test_password@127.0.0.1:5432/aitos_test
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: aitos_test
      CLICKHOUSE_PASSWORD: aitos_test_password
      CLICKHOUSE_DATABASE: aitos_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run PostgreSQL adapter and recovery tests
        run: pytest -q tests/storage/test_postgres_integration.py --junitxml=postgres-adapter.xml
      - name: Verify PostgreSQL-to-ClickHouse bidirectional reconciliation
        run: pytest -q tests/storage/test_postgres_clickhouse_reconciliation.py --junitxml=postgres-reconciliation.xml
      - name: Preserve isolated PostgreSQL validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: isolated-postgres-reconciliation-results
          path: postgres-*.xml
          retention-days: 7
