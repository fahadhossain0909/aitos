name: PostgreSQL Storage Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aitos_test
          POSTGRES_PASSWORD: aitos_test_password
          POSTGRES_DB: aitos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aitos_test -d aitos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AITOS_TEST_POSTGRES_URL: postgresql://aitos_test:aitos_test_password@127.0.0.1:5432/aitos_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run real PostgreSQL adapter round-trip tests
        run: pytest -q tests/storage/test_postgres_integration.py
