name: Temporary Black format fix

on:
  push:
    branches: [fix/clickhouse-batched-persistence]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black
      - name: Format affected files
        run: black aitos/data/market_os_persistence.py aitos/storage/maintenance.py tests/test_market_os_persistence.py
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/data/market_os_persistence.py aitos/storage/maintenance.py tests/test_market_os_persistence.py
          git commit -m "style: format ClickHouse storage changes with Black"
          git push
