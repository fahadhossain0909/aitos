name: One-off contextual intelligence wiring

on:
  push:
    branches: [architecture/market-data-v1]

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, '[oneoff-context-wired]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/market-data-v1
          fetch-depth: 0
      - name: Wire scanner contextual layers
        shell: python
        run: |
          from pathlib import Path
          p = Path('aitos/intelligence/scanner.py')
          s = p.read_text()
          s = s.replace(
              'from aitos.intelligence.auction import auction_context_score\n',
              'from aitos.intelligence.auction import auction_context_score\nfrom aitos.intelligence.advanced_context import (\n    AdvancedMarketContext,\n    build_advanced_context,\n)\nfrom aitos.intelligence.contextual_layers import PositioningContext, positioning_context\n',
              1,
          )
          s = s.replace(
              '    scanned_at: str = field(default_factory=_utc_now_iso)\n',
              '    advanced_context: AdvancedMarketContext | None = None\n    positioning: PositioningContext | None = None\n    scanned_at: str = field(default_factory=_utc_now_iso)\n',
              1,
          )
          s = s.replace(
              '        self._last_oi[symbol] = oi_current\n\n        liquidity_quality',
              '        oi_change = None\n        if oi_previous is not None and oi_previous.open_interest > 0:\n            oi_change = (oi_current.open_interest - oi_previous.open_interest) / oi_previous.open_interest\n        advanced_context = build_advanced_context(\n            klines, current_cvd_score=flow_score, oi_change=oi_change\n        )\n        positioning = positioning_context(\n            open_interest_change=oi_change,\n            funding_rate=float(funding.rate) if hasattr(funding, "rate") else None,\n        )\n        self._last_oi[symbol] = oi_current\n\n        liquidity_quality',
              1,
          )
          s = s.replace(
              '            "footprint_interaction": interaction_score,\n        }\n',
              '            "footprint_interaction": interaction_score,\n            "volume_profile": round(advanced_context.volume_profile.price_location * 10.0, 2) if advanced_context.volume_profile else 5.0,\n            "price_imbalance": round(5.0 + advanced_context.imbalance.displacement_score * 5.0, 2),\n            "structural_symmetry": round(5.0 + (advanced_context.symmetry.similarity * 5.0 if advanced_context.symmetry else 0.0), 2),\n            "forced_flow": round(5.0 + min(5.0, advanced_context.forced_flow_score / 2.0), 2),\n        }\n',
              1,
          )
          s = s.replace(
              '            "footprint_interaction": True,\n        }\n',
              '            "footprint_interaction": footprint_available,\n            "volume_profile": advanced_context.volume_profile is not None,\n            "price_imbalance": bool(advanced_context.imbalance.zones),\n            "structural_symmetry": advanced_context.symmetry is not None,\n            "forced_flow": advanced_context.forced_flow_score >= 0.0,\n        }\n',
              1,
          )
          s = s.replace(
              '            atr=atr,\n            regime=regime,\n',
              '            atr=atr,\n            regime=regime,\n            advanced_context=advanced_context,\n            positioning=positioning,\n',
              1,
          )
          s = s.replace(
              '                    "entry_price": candidate.entry_price,\n',
              '                    "entry_price": candidate.entry_price,\n                    "klines": [k.to_dict() for k in getattr(candidate, "_klines", ())],\n                    "advanced_context": candidate.advanced_context,\n                    "positioning": candidate.positioning,\n',
              1,
          )
          # Keep the full kline history on the candidate without changing its public constructor shape.
          if 'object.__setattr__(candidate, "_klines"' not in s:
              s = s.replace(
                  '        return ScanCandidate(\n',
                  '        candidate = ScanCandidate(\n',
                  1,
              )
              marker = '            positioning=positioning,\n        )\n'
              s = s.replace(marker, marker + '        object.__setattr__(candidate, "_klines", tuple(klines))\n        return candidate\n', 1)
              # Remove the now-unreachable original return close introduced by the replacement.
              s = s.replace(marker + '        return candidate\n        )\n', marker + '        return candidate\n', 1)
          p.write_text(s)
PY
      - name: Validate syntax
        run: python -m compileall -q aitos tests
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/intelligence/scanner.py
          git commit -m "feat: wire contextual intelligence into scanner [oneoff-context-wired]"
          git push
