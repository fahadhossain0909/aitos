name: One-time drawdown persistence repair

on:
  push:
    branches:
      - fix/restore-drawdown-persistence-failure

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and verify source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('aitos/trading/persistent_state.py')
          text = path.read_text()
          needle = '''                },\n            )\n\n    async def load_peak_equity'''
          replacement = '''                },\n            )\n            raise\n\n    async def load_peak_equity'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one drawdown target, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          python -m compileall -q aitos/trading/persistent_state.py
          grep -A4 -B8 'failed to save portfolio drawdown state' aitos/trading/persistent_state.py
      - name: Commit source fix and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aitos/trading/persistent_state.py
          git commit -m 'fix: propagate drawdown persistence failures'
          git rm .github/workflows/restore-drawdown-raise.yml
          git commit -m 'chore: remove one-time drawdown repair workflow'
          git push origin HEAD:fix/restore-drawdown-persistence-failure

# one-shot bootstrap trigger
