name: Restore drawdown persistence failure semantics

on:
  push:
    branches:
      - fix/restore-drawdown-persistence-failure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore save_drawdown exception propagation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aitos/trading/persistent_state.py")
          text = path.read_text()
          needle = '''                },\n            )\n\n    async def load_peak_equity'''
          replacement = '''                },\n            )\n            raise\n\n    async def load_peak_equity'''
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one drawdown target, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Verify patch
        run: |
          python -m compileall -q aitos/trading/persistent_state.py
          python - <<'PY'
          from pathlib import Path
          text = Path("aitos/trading/persistent_state.py").read_text()
          needle = '''                },\n            )\n            raise\n\n    async def load_peak_equity'''
          assert needle in text, "save_drawdown raise was not restored"
          PY

      - name: Run focused persistence tests
        run: |
          python -m pytest -q tests/test_persistent_state.py

      - name: Commit change and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/trading/persistent_state.py .github/workflows/restore-drawdown-raise.yml
          git commit -m "fix: propagate drawdown persistence failures"
          git push origin HEAD:fix/restore-drawdown-persistence-failure
