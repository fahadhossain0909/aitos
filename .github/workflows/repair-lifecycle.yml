name: Repair lifecycle regression

on:
  push:
    paths:
      - .github/workflows/repair-lifecycle.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore lifecycle and apply targeted PnL fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout 4c7bda07a0e78a38f731fab6fe67d4c4f148cf6a -- aitos/trading/lifecycle.py
          python - <<'PY'
          from pathlib import Path
          p = Path("aitos/trading/lifecycle.py")
          s = p.read_text()

          old = '''        direction = 1 if trade.side == TradeSide.LONG else -1
        pnl_pct = ((exit_price - trade.entry_price) / trade.entry_price) * direction
        realized_on_remaining = trade.position_size_usd * pnl_pct
        trade.pnl = (
            round((trade.pnl or 0.0) + realized_on_remaining, 4)
            if trade.partial_exits
            else round(realized_on_remaining, 4)
        )
        trade.pnl_percent = round(pnl_pct * 100, 4)
'''
          new = '''        direction = 1 if trade.side == TradeSide.LONG else -1
        pnl_pct = ((exit_price - trade.entry_price) / trade.entry_price) * direction
        remaining_pnl = trade.position_size_usd * pnl_pct
        trade.pnl = round((trade.pnl or 0.0) + remaining_pnl, 4)
        initial_notional = trade.position_size_usd + sum(
            partial.size_usd for partial in trade.partial_exits
        )
        trade.pnl_percent = round(
            (trade.pnl / initial_notional) * 100, 4
        ) if initial_notional > 0.0 else 0.0
'''
          if old not in s:
              raise SystemExit("expected close_trade block not found")
          s = s.replace(old, new, 1)

          old = '''        direction = 1 if trade.side == TradeSide.LONG else -1
        pnl_pct = ((price - trade.entry_price) / trade.entry_price) * direction
        closed_notional = trade.position_size_usd * close_fraction
        realized = closed_notional * pnl_pct
        trade.partial_exits.append(
'''
          new = '''        if not 0.0 < close_fraction < 1.0:
            raise ValueError("close_fraction must be between 0 and 1")
        direction = 1 if trade.side == TradeSide.LONG else -1
        pnl_pct = ((price - trade.entry_price) / trade.entry_price) * direction
        closed_notional = trade.position_size_usd * close_fraction
        closed_quantity = trade.quantity * close_fraction
        realized = closed_notional * pnl_pct
        trade.partial_exits.append(
'''
          if old not in s:
              raise SystemExit("expected partial-close block not found")
          s = s.replace(old, new, 1)

          old = '''        trade.position_size_usd = round(trade.position_size_usd - closed_notional, 2)
        trade.pnl = round((trade.pnl or 0.0) + realized, 4)
'''
          new = '''        trade.position_size_usd = round(trade.position_size_usd - closed_notional, 2)
        trade.quantity = round(trade.quantity - closed_quantity, 12)
        trade.pnl = round((trade.pnl or 0.0) + realized, 4)
'''
          if old not in s:
              raise SystemExit("expected position reduction block not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- aitos/trading/lifecycle.py
      - name: Commit repaired lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos/trading/lifecycle.py
          git commit -m "fix: restore lifecycle logic and correct partial PnL accounting"
          git push origin HEAD:main
      - name: Remove temporary repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-lifecycle.yml
          git commit -m "chore: remove temporary lifecycle repair workflow"
          git push origin HEAD:main
