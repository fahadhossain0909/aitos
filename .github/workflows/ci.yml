name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    name: Auto-format Python with Black
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    concurrency:
      group: auto-format-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Black
        run: python -m pip install --upgrade pip black==25.12.0
      - name: Determine changed Python files
        id: changed-python
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-list --max-count=1 HEAD^)"
            fi
          fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA" -- '*.py' | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Run Black formatter
        id: format
        if: steps.changed-python.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail
          black ${{ steps.changed-python.outputs.files }}
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark unchanged
        if: steps.changed-python.outputs.files == ''
        run: echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Commit Black formatting changes
        if: steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: auto-format Python with Black"

          # The repository can receive another commit while Black is running.
          # Rebase the formatting commit onto the current remote tip before pushing.
          # Retry a few times so a concurrent push cannot leave CI failed with
          # a non-fast-forward error.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            else
              git rebase --abort || true
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to push Black formatting commit after multiple attempts."
          exit 1

  lint:
    needs: format
    if: needs.format.outputs.changed != 'true'
    runs-on: ubuntu-latest
    name: Lint & Code Quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black==25.12.0 isort pylint
      - name: Determine changed Python files
        id: changed-python
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-list --max-count=1 HEAD^)"
            fi
          fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA" -- '*.py' | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Verify Black formatting
        if: steps.changed-python.outputs.files != ''
        run: black --check --diff ${{ steps.changed-python.outputs.files }}
      - name: Run isort import checker
        if: steps.changed-python.outputs.files != ''
        run: isort --check-only ${{ steps.changed-python.outputs.files }}
      - name: Run Flake8 linter
        if: steps.changed-python.outputs.files != ''
        run: flake8 ${{ steps.changed-python.outputs.files }} --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: No Python files changed
        if: steps.changed-python.outputs.files == ''
        run: echo "No Python files changed; formatting/import gates are not applicable."

  test:
    needs: format
    if: needs.format.outputs.changed != 'true'
    runs-on: ubuntu-latest
    name: Unit Tests
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    timeout-minutes: 45
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: aitos_test
      CLICKHOUSE_PASSWORD: aitos_test_password
      CLICKHOUSE_DATABASE: aitos
      TESTING: 'true'
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_USER: aitos_test
          CLICKHOUSE_PASSWORD: aitos_test_password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov
      - name: Initialize ClickHouse test database
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/ping >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" 'http://127.0.0.1:8123/' --data-binary 'CREATE DATABASE IF NOT EXISTS aitos'
      - name: Create .env file from secrets for tests
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          API_KEY=${{ secrets.API_KEY }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=true
          TESTING=true
          CLICKHOUSE_HOST=$CLICKHOUSE_HOST
          CLICKHOUSE_PORT=$CLICKHOUSE_PORT
          CLICKHOUSE_USER=$CLICKHOUSE_USER
          CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
          CLICKHOUSE_DATABASE=$CLICKHOUSE_DATABASE
          EOF
      - name: Run tests with pytest
        env:
          PYTHONPATH: .
        run: pytest --cov=. --cov-report=xml --cov-report=html --junitxml=junit/test-results-${{ matrix.python-version }}.xml -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml

  security:
    needs: format
    if: needs.format.outputs.changed != 'true'
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools>=83.0.0"
          pip install bandit safety
      - name: Run Bandit security scan
        run: bandit -r aitos run_live_trading.py run_paper_trading.py -x tests -ll -f json -o bandit-report.json
      - name: Check dependencies for vulnerabilities
        run: safety check --json
      - name: Upload security reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: security-reports
          path: bandit-report.json

  docker-validate:
    needs: format
    if: needs.format.outputs.changed != 'true'
    runs-on: ubuntu-latest
    name: Docker & Compose Validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Prepare safe CI environment
        run: |
          set -euo pipefail
          cp .env.example .env
      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null
      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.repo.outputs.repo }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime package is present in image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 "${{ steps.repo.outputs.repo }}:test" -c "from aitos.data.ingestion import DataIngestionService; import aitos.data; print('aitos.data import OK')"

  results:
    runs-on: ubuntu-latest
    name: CI Results
    needs: [format, lint, test, security, docker-validate]
    if: always()
    steps:
      - name: Determine CI status
        id: ci-status
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${{ needs.format.outputs.changed }}" = "true" ]; then
            echo "status=formatted; validation will run in the automatically triggered follow-up CI" >> "$GITHUB_OUTPUT"
            echo "emoji=🔄" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.docker-validate.result }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "emoji=✅" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.ci-status.outputs.emoji }} **CI Pipeline: ${{ steps.ci-status.outputs.status }}**\n\n| Step | Status |\n|------|--------|\n| Formatting | ${{ needs.format.result }} |\n| Linting | ${{ needs.lint.result }} |\n| Tests | ${{ needs.test.result }} |\n| Security | ${{ needs.security.result }} |\n| Docker | ${{ needs.docker-validate.result }} |`
            })
