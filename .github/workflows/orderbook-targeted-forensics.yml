name: Order-book Targeted Forensics

on:
  push:
    branches:
      - forensics/orderbook-targeted-pass
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      window_seconds:
        description: Observation window in seconds
        required: false
        default: '180'
      sample_seconds:
        description: Runtime sampling interval in seconds
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  orderbook-forensics:
    name: VPS order-book forensic pass
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout forensic probe
        uses: actions/checkout@v4

      - name: Check deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/aitos_orderbook_key
          chmod 600 /tmp/aitos_orderbook_key

      - name: Run targeted order-book forensic pass
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WINDOW_SECONDS: ${{ github.event.inputs.window_seconds || '180' }}
          SAMPLE_SECONDS: ${{ github.event.inputs.sample_seconds || '5' }}
        run: |
          set -euo pipefail
          scp -i /tmp/aitos_orderbook_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/orderbook_targeted_forensics.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/orderbook_targeted_forensics.sh"
          # Use the forensic script's existing $HOME default. Passing a literal
          # '$HOME' here previously wrote the bundle somewhere else, so SCP could
          # not retrieve the raw evidence.
          ssh -i /tmp/aitos_orderbook_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/n41/aitos && chmod +x /tmp/orderbook_targeted_forensics.sh && AITOS_ORDERBOOK_FORENSICS_WINDOW_SECONDS='$WINDOW_SECONDS' AITOS_ORDERBOOK_FORENSICS_SAMPLE_SECONDS='$SAMPLE_SECONDS' bash /tmp/orderbook_targeted_forensics.sh"

      - name: Retrieve forensic report
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p orderbook-targeted-forensics
          scp -i /tmp/aitos_orderbook_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r \
            "$DEPLOY_USER@$DEPLOY_HOST:aitos-orderbook-targeted-forensics/." \
            orderbook-targeted-forensics/
          test -s orderbook-targeted-forensics/report.md
          cat orderbook-targeted-forensics/report.md

      - name: Upload forensic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderbook-targeted-forensics
          path: orderbook-targeted-forensics/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: rm -f /tmp/aitos_orderbook_key
