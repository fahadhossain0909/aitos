name: Implement direct WebSocket live path v2

on:
  push:
    paths:
      - .github/workflows/implement-direct-live-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct live architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern: {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # Live cache: direct ingress methods; Redis subscriptions become optional.
          p = 'aitos/intelligence/live_scanner.py'
          repl(p, '    async def initialize(self) -> None:\n', '    async def initialize(self, direct_market_data: bool = False) -> None:\n        self._direct_market_data = direct_market_data\n')
          repl(p, '        for symbol in self._symbols:\n            self._subscriptions.append(\n                await self._bus.subscribe(\n                    f"market.trade.{symbol}",\n                    self._on_trade,\n                    group=LIVE_TRADE_GROUP,\n                    start_id="$",\n                )\n            )\n            self._subscriptions.append(\n                await self._bus.subscribe(\n                    f"market.orderbook.{symbol}",\n                    self._on_book,\n                    group=LIVE_BOOK_GROUP,\n                    start_id="$",\n                )\n            )\n', '        for symbol in self._symbols:\n            if not direct_market_data:\n                self._subscriptions.append(await self._bus.subscribe(f"market.trade.{symbol}", self._on_trade, group=LIVE_TRADE_GROUP, start_id="$"))\n                self._subscriptions.append(await self._bus.subscribe(f"market.orderbook.{symbol}", self._on_book, group=LIVE_BOOK_GROUP, start_id="$"))\n')
          repl(p, '    async def _on_trade(self, event: Event) -> None:\n', '    async def accept_live_trade(self, trade: TradeTick) -> None:\n        await self._on_trade(Event(topic=f"market.trade.{trade.symbol}", payload=trade.to_dict()))\n\n    async def accept_live_order_book(self, book: OrderBookSnapshot) -> None:\n        await self._on_book(Event(topic=f"market.orderbook.{book.symbol}", payload=book.to_dict()))\n\n    async def _on_trade(self, event: Event) -> None:\n')

          # Scanner uses direct cache ingress.
          p = 'aitos/intelligence/scanner.py'
          repl(p, '        await self._live_cache.initialize()\n', '        await self._live_cache.initialize(direct_market_data=True)\n')
          repl(p, '    def _footprint_tick_size(self, symbol: str) -> float | None:\n', '    async def accept_live_trade(self, trade):\n        await self._live_cache.accept_live_trade(trade)\n\n    async def accept_live_order_book(self, book):\n        await self._live_cache.accept_live_order_book(book)\n\n    def _footprint_tick_size(self, symbol: str) -> float | None:\n')

          # Ingestion: direct callback is executed before any persistence I/O.
          p = 'aitos/data/ingestion.py'
          repl(p, 'from collections.abc import AsyncIterator\n', 'from collections.abc import AsyncIterator, Awaitable, Callable\n')
          repl(p, 'TRADE_SINK_CONCURRENCY = 16\n', 'TRADE_SINK_CONCURRENCY = 16\nTRADE_PERSIST_QUEUE_SIZE = 50_000\n')
          repl(p, '        liquidity_trade_window: int = 500,\n    ) -> None:\n', '        liquidity_trade_window: int = 500,\n        live_trade_handler: Callable[[TradeTick], Awaitable[None]] | None = None,\n        live_orderbook_handler: Callable[[OrderBookSnapshot], Awaitable[None]] | None = None,\n    ) -> None:\n')
          repl(p, '        self._trade_sink_semaphore = asyncio.Semaphore(TRADE_SINK_CONCURRENCY)\n', '        self._trade_sink_semaphore = asyncio.Semaphore(TRADE_SINK_CONCURRENCY)\n        self._live_trade_handler = live_trade_handler\n        self._live_orderbook_handler = live_orderbook_handler\n        self._trade_persistence_queue: asyncio.Queue[tuple[TradeTick, dict[str, Any]]] = asyncio.Queue(maxsize=TRADE_PERSIST_QUEUE_SIZE)\n        self._trade_persistence_dropped = 0\n')
          repl(p, '        self._tasks = [\n            asyncio.create_task(self._run_kline_stream(), name="aitos-kline-stream"),\n', '        self._tasks = [\n            asyncio.create_task(self._run_trade_persistence(), name="aitos-trade-persistence"),\n            asyncio.create_task(self._run_kline_stream(), name="aitos-kline-stream"),\n')
          repl(p, '                "trade_sink_concurrency": TRADE_SINK_CONCURRENCY,\n', '                "trade_sink_concurrency": TRADE_SINK_CONCURRENCY,\n                "trade_persistence_queue_size": self._trade_persistence_queue.qsize(),\n                "trade_persistence_queue_capacity": TRADE_PERSIST_QUEUE_SIZE,\n                "trade_persistence_dropped": self._trade_persistence_dropped,\n')
          repl(p, '                self._last_trade_ids[trade.symbol] = trade.trade_id\n', '                if self._live_trade_handler is not None:\n                    try:\n                        await self._live_trade_handler(trade)\n                    except Exception as exc:\n                        logger.exception("direct live trade handler failed", extra={"aitos_extra": {"symbol": trade.symbol, "trade_id": trade.trade_id, "error": str(exc)}})\n                self._last_trade_ids[trade.symbol] = trade.trade_id\n')
          repl(p, '        await asyncio.gather(*(io_one(trade, payload) for trade, payload in accepted))\n', '        for trade, payload in accepted:\n            try:\n                self._trade_persistence_queue.put_nowait((trade, payload))\n            except asyncio.QueueFull:\n                self._trade_persistence_dropped += 1\n                logger.error("trade persistence queue full; live path remains active", extra={"aitos_extra": {"symbol": trade.symbol, "trade_id": trade.trade_id}})\n')
          marker = '    async def _recover_recent_trades(self) -> None:\n'
          worker = '''    async def _run_trade_persistence(self) -> None:\n        while True:\n            trade, payload = await self._trade_persistence_queue.get()\n            try:\n                async with self._trade_sink_semaphore:\n                    jobs = [\n                        self._event_bus.publish(Event(topic=trade_topic(trade.symbol), payload=trade.to_dict(), source_module=self.module_id, priority=EventPriority.NORMAL)),\n                        self._event_bus.publish(Event(topic=orderflow_topic(trade.symbol), payload=payload, source_module=self.module_id, priority=EventPriority.NORMAL)),\n                    ]\n                    if self._repository is not None:\n                        jobs.append(self._repository.save_trade_tick(trade))\n                    await asyncio.gather(*jobs)\n            except Exception as exc:\n                self._errors += 1\n                self._trade_downstream_errors += 1\n                logger.exception("trade persistence failed", extra={"aitos_extra": {"symbol": trade.symbol, "trade_id": trade.trade_id, "error": str(exc)}})\n            finally:\n                self._trade_persistence_queue.task_done()\n\n'''
          repl(p, marker, worker + marker)
          repl(p, '    async def _handle_order_book(self, book: OrderBookSnapshot) -> None:\n        await self._event_bus.publish(\n', '    async def _handle_order_book(self, book: OrderBookSnapshot) -> None:\n        if self._live_orderbook_handler is not None:\n            try:\n                await self._live_orderbook_handler(book)\n            except Exception as exc:\n                logger.exception("direct live order-book handler failed", extra={"aitos_extra": {"symbol": book.symbol, "last_update_id": book.last_update_id, "error": str(exc)}})\n        await self._event_bus.publish(\n')

          # Wire scanner before ingestion and pass direct callbacks.
          p = 'aitos/app.py'
          repl(p, '        modules += [self.data_ingestion, self.scanner, self.trade_lifecycle]\n', '        modules += [self.scanner, self.data_ingestion, self.trade_lifecycle]\n')
          repl(p, '        repository=market_data_repository,\n    )\n', '        repository=market_data_repository,\n        live_trade_handler=scanner.accept_live_trade,\n        live_orderbook_handler=scanner.accept_live_order_book,\n    )\n')

          Path('tests/test_direct_live_market_path.py').write_text('''from datetime import datetime, timezone\nimport pytest\nfrom aitos.data.ingestion import DataIngestionService\nfrom aitos.models.market import TradeSide, TradeTick\n\nclass Exchange:\n    async def connect(self): pass\n    async def close(self): pass\n\n@pytest.mark.asyncio\nasync def test_direct_live_path_admits_trade_without_waiting_for_persistence(event_bus):\n    received = []\n    trade = TradeTick(symbol="BTCUSDT", trade_id=123, price=100.0, quantity=1.0, side=TradeSide.BUY, is_buyer_maker=False, timestamp=datetime.now(timezone.utc))\n    async def handler(t): received.append(t.trade_id)\n    service = DataIngestionService(exchange=Exchange(), event_bus=event_bus, symbols=["BTCUSDT"], live_trade_handler=handler)\n    await service.initialize({})\n    await service._process_trade_batch([trade])\n    assert received == [123]\n    assert service._trade_persistence_queue.qsize() == 1\n    await service.shutdown(grace_period_seconds=2.0)\n''')
          PY
      - name: Validate
        run: |
          python -m compileall -q aitos tests/test_direct_live_market_path.py
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          pytest -q tests/test_direct_live_market_path.py tests/test_ingestion.py tests/test_live_scanner_cache.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aitos tests/test_direct_live_market_path.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: bypass Redis for live scanner market data"
          git push
