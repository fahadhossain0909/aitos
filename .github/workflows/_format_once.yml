name: One-time branch formatting

on:
  push:
    branches:
      - ci/production-quality-gates
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatters
        run: python -m pip install --upgrade black isort
      - name: Apply isort then Black
        run: |
          isort .
          black .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: normalize repository formatting'
          git push origin HEAD:ci/production-quality-gates
