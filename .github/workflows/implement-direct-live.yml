name: Implement direct WebSocket live path

on:
  push:
    paths:
      - .github/workflows/implement-direct-live.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct live market-data architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, count))

          # 1) LiveScannerCache: allow ingestion to feed the cache directly.
          path = 'aitos/intelligence/live_scanner.py'
          p = Path(path)
          s = p.read_text()
          replace(path,
              '        self._initialized = False\n        self._last_freshness_log_at: dict[str, datetime] = {}\n',
              '        self._initialized = False\n        self._direct_market_data = False\n        self._last_freshness_log_at: dict[str, datetime] = {}\n')
          replace(path,
              '    async def initialize(self) -> None:\n        if self._initialized:\n            return\n        for symbol in self._symbols:\n            self._subscriptions.append(\n                await self._bus.subscribe(\n                    f"market.trade.{symbol}",\n                    self._on_trade,\n                    group=LIVE_TRADE_GROUP,\n                    start_id="$",\n                )\n            )\n            self._subscriptions.append(\n                await self._bus.subscribe(\n                    f"market.orderbook.{symbol}",\n                    self._on_book,\n                    group=LIVE_BOOK_GROUP,\n                    start_id="$",\n                )\n            )\n            self._subscriptions.append(\n                await self._bus.subscribe(\n                    f"market.liquidity.{symbol}",\n                    self._on_liquidity,\n                    group=LIVE_LIQUIDITY_GROUP,\n                    start_id="$",\n                )\n            )\n        self._initialized = True\n',
              '    async def initialize(self, direct_market_data: bool = False) -> None:\n        if self._initialized:\n            return\n        self._direct_market_data = direct_market_data\n        for symbol in self._symbols:\n            if not direct_market_data:\n                self._subscriptions.append(\n                    await self._bus.subscribe(\n                        f"market.trade.{symbol}",\n                        self._on_trade,\n                        group=LIVE_TRADE_GROUP,\n                        start_id="$",\n                    )\n                )\n                self._subscriptions.append(\n                    await self._bus.subscribe(\n                        f"market.orderbook.{symbol}",\n                        self._on_book,\n                        group=LIVE_BOOK_GROUP,\n                        start_id="$",\n                    )\n                )\n            self._subscriptions.append(\n                await self._bus.subscribe(\n                    f"market.liquidity.{symbol}",\n                    self._on_liquidity,\n                    group=LIVE_LIQUIDITY_GROUP,\n                    start_id="$",\n                )\n            )\n        self._initialized = True\n')
          replace(path,
              '    async def _on_trade(self, event: Event) -> None:\n        trade = TradeTick.from_dict(event.payload)\n        now = datetime.now(timezone.utc)\n',
              '    async def accept_live_trade(self, trade: TradeTick) -> None:\n        """Accept a trade directly from the WebSocket ingestion fast lane."""\n        await self._accept_trade(trade)\n\n    async def accept_live_order_book(self, book: OrderBookSnapshot) -> None:\n        """Accept an order-book update directly from the WebSocket fast lane."""\n        await self._accept_book(book)\n\n    async def _on_trade(self, event: Event) -> None:\n        await self._accept_trade(TradeTick.from_dict(event.payload))\n\n    async def _accept_trade(self, trade: TradeTick) -> None:\n        now = datetime.now(timezone.utc)\n')
          replace(path,
              '    async def _on_book(self, event: Event) -> None:\n        book = OrderBookSnapshot.from_dict(event.payload)\n        state = self._cache(book.symbol)\n',
              '    async def _on_book(self, event: Event) -> None:\n        await self._accept_book(OrderBookSnapshot.from_dict(event.payload))\n\n    async def _accept_book(self, book: OrderBookSnapshot) -> None:\n        state = self._cache(book.symbol)\n')

          # 2) Scanner: direct fast lane becomes its canonical live market source.
          path = 'aitos/intelligence/scanner.py'
          replace(path,
              '        self._live_cache = LiveScannerCache(\n            event_bus, symbols, max_trades=max(5000, trade_lookback)\n        )\n',
              '        self._live_cache = LiveScannerCache(\n            event_bus, symbols, max_trades=max(5000, trade_lookback)\n        )\n')
          replace(path,
              '        await self._live_cache.initialize()\n',
              '        await self._live_cache.initialize(direct_market_data=True)\n')
          marker = '    def _footprint_tick_size(self, symbol: str) -> float | None:\n'
          replacement = '''    async def accept_live_trade(self, trade):\n        """Fast-path WebSocket trade ingress; bypasses Redis for live scanning."""\n        await self._live_cache.accept_live_trade(trade)\n\n    async def accept_live_order_book(self, book):\n        """Fast-path WebSocket order-book ingress; bypasses Redis for live scanning."""\n        await self._live_cache.accept_live_order_book(book)\n\n'''
          replace(path, marker, replacement + marker)

          # 3) Ingestion: publish to scanner before any Redis/ClickHouse I/O.\n          path = 'aitos/data/ingestion.py'
          replace(path,
              'from collections.abc import AsyncIterator\n',
              'from collections.abc import AsyncIterator, Awaitable, Callable\n')
          replace(path,
              'TRADE_SINK_CONCURRENCY = 16\n',
              'TRADE_SINK_CONCURRENCY = 16\nTRADE_PERSIST_QUEUE_SIZE = 50_000\n')
          replace(path,
              '        liquidity_trade_window: int = 500,\n    ) -> None:\n',
              '        liquidity_trade_window: int = 500,\n        live_trade_handler: Callable[[TradeTick], Awaitable[None]] | None = None,\n        live_orderbook_handler: Callable[[OrderBookSnapshot], Awaitable[None]] | None = None,\n    ) -> None:\n')
          replace(path,
              '        self._trade_sink_semaphore = asyncio.Semaphore(TRADE_SINK_CONCURRENCY)\n',
              '        self._trade_sink_semaphore = asyncio.Semaphore(TRADE_SINK_CONCURRENCY)\n        self._live_trade_handler = live_trade_handler\n        self._live_orderbook_handler = live_orderbook_handler\n        self._trade_persistence_queue: asyncio.Queue[tuple[TradeTick, dict[str, Any]]] = asyncio.Queue(maxsize=TRADE_PERSIST_QUEUE_SIZE)\n        self._trade_persistence_dropped = 0\n')
          replace(path,
              '        self._tasks = [\n            asyncio.create_task(self._run_kline_stream(), name="aitos-kline-stream"),\n',
              '        self._tasks = [\n            asyncio.create_task(self._run_trade_persistence(), name="aitos-trade-persistence"),\n            asyncio.create_task(self._run_kline_stream(), name="aitos-kline-stream"),\n')
          replace(path,
              '                "trade_sink_concurrency": TRADE_SINK_CONCURRENCY,\n',
              '                "trade_sink_concurrency": TRADE_SINK_CONCURRENCY,\n                "trade_persistence_queue_size": self._trade_persistence_queue.qsize(),\n                "trade_persistence_queue_capacity": TRADE_PERSIST_QUEUE_SIZE,\n                "trade_persistence_dropped": self._trade_persistence_dropped,\n')
          # Direct trade callback immediately after local live-state update.
          replace(path,
              '                self._last_trade_ids[trade.symbol] = trade.trade_id\n                self._orderflow_events += 1\n',
              '                if self._live_trade_handler is not None:\n                    try:\n                        await self._live_trade_handler(trade)\n                    except Exception as exc:\n                        logger.exception(\n                            "direct live trade handler failed",\n                            extra={"aitos_extra": {"symbol": trade.symbol, "trade_id": trade.trade_id, "error": str(exc)}},\n                        )\n                self._last_trade_ids[trade.symbol] = trade.trade_id\n                self._orderflow_events += 1\n')
          # Replace the blocking downstream gather with a non-blocking persistence admission.
          old = '        await asyncio.gather(*(io_one(trade, payload) for trade, payload in accepted))\n        for trade, _payload in accepted:\n            await self._publish_live_state(trade.symbol)\n'
          new = '''        for trade, payload in accepted:\n            try:\n                self._trade_persistence_queue.put_nowait((trade, payload))\n            except asyncio.QueueFull:\n                # Live trading must never wait behind historical persistence.\n                # Record the overload explicitly; the next audit can distinguish\n                # persistence pressure from live-data loss.\n                self._trade_persistence_dropped += 1\n                logger.error(\n                    "trade persistence queue full; live path remains active",\n                    extra={"aitos_extra": {"symbol": trade.symbol, "trade_id": trade.trade_id, "queue_capacity": TRADE_PERSIST_QUEUE_SIZE}},\n                )\n        for trade, _payload in accepted:\n            await self._publish_live_state(trade.symbol)\n\n    async def _run_trade_persistence(self) -> None:\n        """Persist Redis/ClickHouse independently from the WebSocket live lane."""\n        while True:\n            trade, payload = await self._trade_persistence_queue.get()\n            try:\n                await self._persist_trade(trade, payload)\n            finally:\n                self._trade_persistence_queue.task_done()\n\n    async def _persist_trade(self, trade: TradeTick, payload: dict[str, Any]) -> None:\n        async with self._trade_sink_semaphore:\n            try:\n                jobs = [\n                    self._event_bus.publish(\n                        Event(\n                            topic=trade_topic(trade.symbol),\n                            payload=trade.to_dict(),\n                            source_module=self.module_id,\n                            priority=EventPriority.NORMAL,\n                        )\n                    ),\n                    self._event_bus.publish(\n                        Event(\n                            topic=orderflow_topic(trade.symbol),\n                            payload=payload,\n                            source_module=self.module_id,\n                            priority=EventPriority.NORMAL,\n                        )\n                    ),\n                ]\n                if self._repository is not None:\n                    jobs.append(self._repository.save_trade_tick(trade))\n                await asyncio.gather(*jobs)\n            except Exception as exc:\n                self._errors += 1\n                self._trade_downstream_errors += 1\n                logger.exception(\n                    "trade persistence failed",\n                    extra={"aitos_extra": {"symbol": trade.symbol, "trade_id": trade.trade_id, "error_type": type(exc).__name__, "error": str(exc)}},\n                )\n'''
          replace(path, old, new)
          # Remove the now-unused local io_one block by deleting its definition body.
          start = s = Path(path).read_text()
          a = start.find('        async def io_one(')
          b = start.find('        for trade, payload in accepted:', a)
          if a == -1 or b == -1:
              raise SystemExit('io_one block boundaries not found')
          # Keep the new persistence admission that starts at b.
          Path(path).write_text(start[:a] + start[b:])
          # Direct order-book callback before Redis publish.
          replace(path,
              '    async def _handle_order_book(self, book: OrderBookSnapshot) -> None:\n        await self._event_bus.publish(\n',
              '    async def _handle_order_book(self, book: OrderBookSnapshot) -> None:\n        if self._live_orderbook_handler is not None:\n            try:\n                await self._live_orderbook_handler(book)\n            except Exception as exc:\n                logger.exception(\n                    "direct live order-book handler failed",\n                    extra={"aitos_extra": {"symbol": book.symbol, "last_update_id": book.last_update_id, "error": str(exc)}},\n                )\n        await self._event_bus.publish(\n')

          # 4) App wiring: initialize scanner before ingestion and pass direct handlers.
          path = 'aitos/app.py'
          replace(path,
              '        modules += [self.data_ingestion, self.scanner, self.trade_lifecycle]\n',
              '        modules += [self.scanner, self.data_ingestion, self.trade_lifecycle]\n')
          replace(path,
              '        repository=market_data_repository,\n    )\n',
              '        repository=market_data_repository,\n        live_trade_handler=scanner.accept_live_trade,\n        live_orderbook_handler=scanner.accept_live_order_book,\n    )\n')

          # 5) Add a direct-path test proving Redis is not required for live cache updates.
          test_path = 'tests/test_direct_live_market_path.py'
          Path(test_path).write_text('''import asyncio\nfrom datetime import datetime, timezone\n\nimport pytest\n\nfrom aitos.data.ingestion import DataIngestionService\nfrom aitos.models.market import TradeSide, TradeTick\n\n\nclass _Exchange:\n    async def connect(self): pass\n    async def close(self): pass\n\n\n@pytest.mark.asyncio\nasync def test_direct_live_trade_handler_receives_trade_before_persistence(event_bus):\n    received = []\n    trade = TradeTick(\n        symbol="BTCUSDT", trade_id=123, price=100.0, quantity=1.0,\n        side=TradeSide.BUY, is_buyer_maker=False, timestamp=datetime.now(timezone.utc)\n    )\n\n    async def handler(value):\n        received.append(value.trade_id)\n\n    service = DataIngestionService(\n        exchange=_Exchange(), event_bus=event_bus, symbols=["BTCUSDT"],\n        live_trade_handler=handler\n    )\n    await service.initialize({})\n    await service._process_trade_batch([trade])\n    assert received == [123]\n    assert service._trade_persistence_queue.qsize() == 1\n    await service.shutdown(grace_period_seconds=2.0)\n''')\n\n          PY\n\n      - name: Validate and test\n        run: |\n          python -m compileall -q aitos tests/test_direct_live_market_path.py\n          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi\n          pytest -q tests/test_direct_live_market_path.py tests/test_ingestion.py tests/test_live_scanner_cache.py\n\n      - name: Commit implementation\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add aitos tests/test_direct_live_market_path.py\n          if git diff --cached --quiet; then\n            echo "No implementation changes to commit"\n            exit 0\n          fi\n          git commit -m "feat: bypass Redis for live scanner market data"\n          git push\n