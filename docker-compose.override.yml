services:
  # Do not override Redis command here. Compose replaces (rather than merges)
  # command arrays, which would silently remove requirepass, maxmemory,
  # maxmemory-policy and appendfsync from docker-compose.yml.

  neo4j:
    environment:
      NEO4J_db_tx__log_rotation_retention__policy: "2 days 100M"

  aitos-storage-maintenance:
    environment:
      DATA_DISK_DIR: /data-disk
      # Inherit DATA_DISK_MIN_FREE_GB from the base compose file (2.5 GB).
      DATA_DISK_TARGET_FREE_GB: "25"
      STORAGE_AUTO_DELETE_PERCENT: "2.5"
      STORAGE_MAINTENANCE_INTERVAL_SECONDS: "300"
      STORAGE_MAINTENANCE_DRY_RUN: "${STORAGE_MAINTENANCE_DRY_RUN:-true}"
    volumes:
      - "${AITOS_DATA_ROOT:-./data}:/data-disk"
