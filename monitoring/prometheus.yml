global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts/world-intelligence.yml
  - alerts/capital-intelligence.yml

scrape_configs:
  - job_name: aitos-paper
    metrics_path: /metrics
    static_configs:
      - targets: ["aitos-paper:8090"]

  - job_name: aitos-live
    metrics_path: /metrics
    static_configs:
      - targets: ["aitos-live:8091"]

  - job_name: aitos-world-intelligence
    metrics_path: /metrics
    static_configs:
      - targets: ["aitos-world-intelligence:8120"]

  - job_name: aitos-capital-intelligence
    metrics_path: /metrics
    static_configs:
      - targets: ["aitos-capital-intelligence:8121"]
