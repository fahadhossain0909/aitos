daemonize yes
port 6379
bind 127.0.0.1

# Memory: 512MB with allkeys-lru eviction policy
maxmemory 536870912
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence
save 3600 1 300 100 60 10000
appendonly yes
appendfsync everysec

# Security (override as needed)
# requirepass REDIS_PASSWORD
